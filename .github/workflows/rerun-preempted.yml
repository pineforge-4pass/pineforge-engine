# workflow_run activates only after this file reaches the default branch.
# The script separately checks the exact path/event; manual runs are excluded.
name: Retry preempted CI jobs

on:
  workflow_run:
    workflows:
      - CI post-merge
      - GKE PR
    types: [completed]

permissions:
  actions: write
  contents: read
  checks: read

concurrency:
  group: retry-preempted-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (((github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'schedule') &&
        github.event.workflow_run.head_branch == 'main') ||
       github.event.workflow_run.event == 'pull_request_target')
    runs-on: ubuntu-24.04
    steps:
      - name: Require controller tools
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          python3 --version
          gh_api_help=$(gh api --help)
          grep -q -- '--allow-escape-sequences' <<< "$gh_api_help" || {
            echo "gh api lacks --allow-escape-sequences; job logs cannot be read" >&2
            exit 1
          }
      - name: Load the controller from its trusted default-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/rerun_preempted.py
          sparse-checkout-cone-mode: false
      - name: Retry only failures caused by runner loss
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          gh --version
          python3 scripts/ci/rerun_preempted.py \
            --run-id "$SOURCE_RUN_ID" \
            --expected-attempt "$SOURCE_ATTEMPT"
