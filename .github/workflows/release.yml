name: Release

# Bump VERSION, tag, cut a GitHub Release with generated notes, attach the
# prebuilt static-lib tarballs, and notify the pineforge-release hub — all
# from a single workflow_dispatch click. This workflow publishes no container
# image: the GHCR image is the hub's, built from these tarballs.
#
# Trigger: GitHub UI → Actions → Release → "Run workflow" → pick bump, or
# name the exact version in `override` (a release candidate is
# X.Y.Z-rc.N, then the final release is override X.Y.Z). Tick `dry_run` to
# rehearse: it computes the version, builds, installs, verifies and packs
# every tarball (kept as workflow artifacts), and commits, tags, releases,
# uploads and dispatches nothing.
#
# A release candidate (X.Y.Z-rc.N) is created as a GitHub prerelease, and
# the hub dispatch carries it: client_payload = {version: "vX.Y.Z-rc.N",
# prerelease: true, run_id}; a final release sends prerelease: false. The
# engine and codegen release one version number from 1.0.0; the hub pairs
# them (docs/pages/public-contract.md).
#
# The version arithmetic is scripts/release_version.py (unit tests:
# scripts/test_release_version.py, a ci_preflight stage), not YAML.
#
# Security notes:
#   - `bump` is a `choice` enum. `override` is free text: it reaches only
#     scripts/release_version.py, through an `env:` block, which refuses
#     anything but X.Y.Z or X.Y.Z-rc.N before any later step reads it.
#   - All other interpolations are GitHub-controlled context (repo, actor,
#     sha, secrets) or values the script computed from VERSION and the tags.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      override:
        description: 'Exact version, X.Y.Z or X.Y.Z-rc.N (for example 1.0.0-rc.1); wins over bump'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Rehearse: build and verify the tarballs; commit, tag, release, upload and dispatch nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      tag:        ${{ steps.bump.outputs.tag }}
      version:    ${{ steps.bump.outputs.next }}
      prerelease: ${{ steps.bump.outputs.prerelease }}

    steps:
      # Org GitHub App token (no PAT — never expires). Authorizes the version
      # bump commit/tag push to protected main (the App is a bypass actor on the
      # org ruleset) AND the downstream hub dispatch. Scoped to this repo + the
      # hub. Minted first so checkout can push with it.
      - name: Mint org App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: pineforge-engine

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # App token bypasses the org ruleset (PR-required) for the bump push.
          token: ${{ steps.app.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # current / next / tag / prerelease / previous (the release-notes base),
      # validated; see scripts/release_version.py.
      - name: Compute next version
        id: bump
        env:
          BUMP:     ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.override }}
        run: |
          set -euo pipefail
          git tag --list 'v*' > "${RUNNER_TEMP}/tags.txt"
          python3 scripts/release_version.py next \
            --bump "${BUMP}" --override "${OVERRIDE}" \
            --tags-file "${RUNNER_TEMP}/tags.txt" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Refuse if tag already exists
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists -- pick a different bump" >&2
            exit 1
          fi

      - name: Write bumped VERSION, commit, tag, push
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          TAG:  ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEXT}" > VERSION
          git add VERSION
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD
          git push origin "${TAG}"

      # The range starts at scripts/release_version.py's `previous`: the last
      # tag below this release in semver order (git's v:refname sort puts
      # X.Y.Z-rc.N above X.Y.Z), and the last final release for a final one.
      # A dry run has no tag yet and ends the range at the dispatched commit.
      - name: Generate release notes
        id: notes
        env:
          TAG:       ${{ steps.bump.outputs.tag }}
          PREV:      ${{ steps.bump.outputs.previous }}
          RANGE_END: ${{ inputs.dry_run && github.sha || steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## ${TAG}"
            echo
            if [[ -n "$PREV" ]]; then
              echo "### Changes since ${PREV}"
              echo
              git log --pretty=format:'- %s (%h)' "${PREV}..${RANGE_END}"
            else
              echo "### Initial release"
              echo
              git log --pretty=format:'- %s (%h)' "${RANGE_END}"
            fi
            echo
            echo
            echo "### Prebuilt libraries"
            echo
            echo "Per-arch static-lib + headers tarballs are attached below (C ABI)."
            echo "For the full PineScript -> backtest image, use \`ghcr.io/pineforge-4pass/pineforge-release\`."
          } > RELEASE_NOTES.md
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      # A release candidate is a GitHub prerelease, which GitHub never marks
      # "Latest".
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          TAG:        ${{ steps.bump.outputs.tag }}
          NOTES:      ${{ steps.notes.outputs.path }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${PRERELEASE}" == "true" ]]; then prerelease=(--prerelease); fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES}" \
            --verify-tag \
            "${prerelease[@]}"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          CURRENT:    ${{ steps.bump.outputs.current }}
          NEXT:       ${{ steps.bump.outputs.next }}
          TAG:        ${{ steps.bump.outputs.tag }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
          PREV:       ${{ steps.bump.outputs.previous }}
          NOTES:      ${{ steps.notes.outputs.path }}
          RUN_ID:     ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Dry run: ${CURRENT} -> ${NEXT}"
            echo
            echo "- would commit VERSION=${NEXT} and push the tag ${TAG}"
            echo "- would create the GitHub release ${TAG} (prerelease: ${PRERELEASE}), notes since ${PREV:-the first commit}"
            echo "- would dispatch engine-release to pineforge-release with client_payload {\"version\": \"${TAG}\", \"prerelease\": ${PRERELEASE}, \"run_id\": ${RUN_ID}}"
            echo
            cat "${NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"
          cat "${GITHUB_STEP_SUMMARY}"

  # Prebuilt static-lib + headers tarballs, one per (os, arch). Attached
  # to the GitHub Release created above. Tarball layout:
  #   pineforge-vX.Y.Z-{triple}/
  #     include/pineforge/*.{h,hpp}    (curated + generated version.h)
  #     lib/libpineforge.a
  #     lib/cmake/PineForge/*.cmake
  #     LICENSE NOTICE VERSION
  #
  # Consumers still need Eigen3 (>= 3.3) installed system-wide; see
  # release notes / README.
  prebuilt:
    needs: release
    permissions:
      contents: write   # gh release upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x86_64
            runner: ubuntu-22.04
            cmake_extra: ""
          - triple: linux-aarch64
            runner: ubuntu-22.04-arm
            cmake_extra: ""
          # Single universal slice covers x86_64 + arm64 macs. macos-13
          # (Intel) runner pool is being phased out and queues for >30min;
          # cross-build a fat archive on macos-latest (arm64) instead.
          - triple: macos-universal
            runner: macos-latest
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
    runs-on: ${{ matrix.runner }}

    steps:
      # A dry run has no tag yet: it builds the dispatched commit.
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || needs.release.outputs.tag }}
          fetch-depth: 0   # the version helper still observes the git sha

      - name: Write the dry run's VERSION
        if: ${{ inputs.dry_run }}
        env:
          NEXT: ${{ needs.release.outputs.version }}
        run: printf '%s\n' "${NEXT}" > VERSION

      - name: Install Eigen3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Install Eigen3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eigen
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen)" >> "$GITHUB_ENV"

      - name: Configure
        env:
          TAG:         ${{ needs.release.outputs.tag }}
          TRIPLE:      ${{ matrix.triple }}
          CMAKE_EXTRA: ${{ matrix.cmake_extra }}
        run: |
          set -euo pipefail
          stage="stage/pineforge-${TAG}-${TRIPLE}"
          echo "STAGE_DIR=${stage}" >> "$GITHUB_ENV"
          # FILE: the version identity is the VERSION file exactly, -rc.N
          # included, however the checkout's tags describe it; a dry run's
          # VERSION has no tag at all.
          # CMAKE_EXTRA is unquoted so multi-flag strings (e.g. mac fat
          # archive flag) split into separate argv entries.
          # shellcheck disable=SC2086
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPINEFORGE_BUILD_TESTS=OFF \
            -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_VERSION_SOURCE=FILE \
            -DCMAKE_INSTALL_PREFIX="${PWD}/${stage}" \
            ${CMAKE_EXTRA}

      - name: Build
        run: cmake --build build -j 4

      - name: Install to staging
        run: cmake --install build

      # The generated version.h and the CMake package files must carry the
      # full version, -rc.N included, and its numeric X.Y.Z.
      - name: Verify the staged version
        env:
          NEXT: ${{ needs.release.outputs.version }}
        run: |
          python3 scripts/release_version.py check-install \
            --prefix "${STAGE_DIR}" --expect "${NEXT}"

      - name: Bundle docs into tarball root
        run: |
          set -euo pipefail
          cp LICENSE NOTICE VERSION "${STAGE_DIR}/"

      - name: Pack tarball + sha256
        id: pack
        env:
          TAG:    ${{ needs.release.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          base="pineforge-${TAG}-${TRIPLE}"
          tarball="${base}.tar.gz"
          tar -czf "${tarball}" -C stage "${base}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${tarball}" > "${tarball}.sha256"
          else
            shasum -a 256 "${tarball}" > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}"           >> "$GITHUB_OUTPUT"
          echo "sha256=${tarball}.sha256"     >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:     ${{ needs.release.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SHASUM:  ${{ steps.pack.outputs.sha256 }}
        run: |
          gh release upload "${TAG}" "${TARBALL}" "${SHASUM}" --clobber

      - name: Keep the dry run's tarball as a workflow artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.tarball }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.sha256 }}
          retention-days: 7

  # Notify the pineforge-release hub AFTER the tarballs are uploaded — the hub
  # builds FROM the engine static-lib tarball, so it must exist first. The hub
  # bumps its ENGINE_VERSION pin, rebuilds the combined image, and fans out to
  # the MCPs. FAIL LOUD (no continue-on-error): a dropped notify means downstream
  # never rebuilds. Credential is the org GitHub App (no PAT).
  notify-hub:
    needs: [release, prebuilt]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint org App token (hub dispatch)
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: pineforge-release

      # client_payload = {version: vX.Y.Z[-rc.N], prerelease: true|false,
      # run_id}. -F sends prerelease as a JSON boolean and run_id as a
      # number. The hub never publishes a prerelease to its stable or
      # `latest` channels and pairs the engine with codegen of the same
      # version (lane REL10-HUB).
      - name: Dispatch engine-release -> pineforge-release
        env:
          GH_TOKEN:   ${{ steps.app.outputs.token }}
          ENGINE_TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          RUN_ID:     ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api repos/pineforge-4pass/pineforge-release/dispatches \
            -f event_type=engine-release \
            -F "client_payload[version]=${ENGINE_TAG}" \
            -F "client_payload[prerelease]=${PRERELEASE}" \
            -F "client_payload[run_id]=${RUN_ID}"
          echo "dispatched engine-release -> pineforge-release (${ENGINE_TAG}, prerelease=${PRERELEASE})"
