name: GKE PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

run-name: "gke-pr #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"

permissions: {}

concurrency:
  group: gke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admit:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs:
      allowed: ${{ steps.allowed.outputs.allowed }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      github_only: ${{ steps.classify.outputs.github_only }}
      arm_relevant: ${{ steps.classify.outputs.arm_relevant }}
    steps:
      - name: Checkout the base checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the live pull request and actors
        id: identity
        env:
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          HEAD_IS_FORK: ${{ toJSON(github.event.pull_request.head.repo.fork) }}
          DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor || '' }}
          ACTOR: ${{ github.actor || '' }}
          GH_TOKEN: ${{ github.token }}
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -euo pipefail
          fail() { echo "::error title=gke-pr admission::$1"; exit 1; }
          test "$HEAD_REPO" = "$REPO" || fail "head repository is not this repository"
          test "$HEAD_IS_FORK" = false || fail "pull request is a fork"
          test "$DRAFT" = false || fail "pull request is a draft"
          test "$BASE_REF" = main || fail "base is not main"
          printf '%s\n' "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$' || fail "payload SHA is invalid"
          test "$PR_NUMBER" -gt 0 || fail "pull request number is invalid"
          for login in "$PR_AUTHOR" "$TRIGGERING_ACTOR" "$ACTOR"; do
            test -n "$login" || fail "an actor login is missing"
            case " $ALLOWED_BOTS " in
              *" $login "*) ;;
              *)
                permission=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission 2>/dev/null) \
                  || fail "permission lookup failed for $login"
                case "$permission" in
                  admin|maintain|write) ;;
                  *) fail "$login does not have write permission" ;;
                esac
                ;;
            esac
          done
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .state) || fail "live pull request read failed"
          draft=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .draft) || fail "live draft read failed"
          live_head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || fail "live head read failed"
          live_base=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref) || fail "live base read failed"
          live_repo=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.repo.full_name) || fail "live repository read failed"
          test "$state" = open || fail "pull request is not open"
          test "$draft" = false || fail "live pull request is a draft"
          test "$live_head" = "$HEAD_SHA" || fail "live head differs from the event head"
          test "$live_base" = main || fail "live base is not main"
          test "$live_repo" = "$REPO" || fail "live head repository differs from this repository"
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Install the pinned workflow parser
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/gke-pr-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Read the payload-bound compare file list
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          PATH_FILE: ${{ runner.temp }}/gke-pr-paths
        shell: python3 {0}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          repo = os.environ["REPO"]
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          paths = []
          endpoint = f"repos/{repo}/compare/{base}...{head}"
          result = subprocess.run(["gh", "api", endpoint], check=True,
                                  capture_output=True, text=True)
          response = json.loads(result.stdout)
          rows = response.get("files")
          if not isinstance(rows, list):
              raise SystemExit("compare response has no readable files list")
          if len(rows) >= 300:
              raise SystemExit("PR changes 300+ files: admission by compare is truncated")
          for row in rows:
              if not isinstance(row, dict):
                  raise SystemExit("compare response has an unreadable file row")
              filename = row.get("filename")
              if (not isinstance(filename, str) or "\x00" in filename
                      or any(part in ("", ".", "..") for part in filename.split("/"))):
                  raise SystemExit("compare response has an unreadable filename")
              paths.append(filename)
              if row.get("status") == "renamed" and "previous_filename" not in row:
                  raise SystemExit("compare response is missing a rename origin")
              if "previous_filename" in row:
                  previous = row["previous_filename"]
                  if (not isinstance(previous, str) or "\x00" in previous
                          or any(part in ("", ".", "..") for part in previous.split("/"))):
                      raise SystemExit("compare response has an unreadable previous filename")
                  paths.append(previous)
          if not paths:
              raise SystemExit("compare response has no changed paths")
          Path(os.environ["PATH_FILE"]).write_bytes(
              b"\0".join(path.encode("utf-8") for path in paths)
              + (b"\0" if paths else b""))

      - name: Classify with the base tree
        id: classify
        env:
          PATH_FILE: ${{ runner.temp }}/gke-pr-paths
        run: python3 scripts/ci_docs_only.py --paths "$PATH_FILE" --github-output "$GITHUB_OUTPUT"

      - name: Fetch head workflow files as data
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RULES_ROOT: ${{ runner.temp }}/gke-pr-rules
        shell: python3 {0}
        run: |
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path(os.environ["RULES_ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          repo = os.environ["REPO"]
          head = os.environ["HEAD_SHA"]

          def api(endpoint):
              result = subprocess.run(["gh", "api", endpoint], check=True,
                                      capture_output=True, text=True)
              return json.loads(result.stdout)

          tree = api(f"repos/{repo}/git/trees/{head}?recursive=1")
          if tree.get("truncated") is True:
              raise SystemExit("head tree is truncated")
          kept = []
          for entry in tree.get("tree", []):
              path = entry.get("path")
              if not isinstance(path, str):
                  raise SystemExit("head tree contains an unreadable path")
              if not (path == ".github/actionlint.yaml"
                      or path.startswith(".github/workflows/")
                      or path.startswith(".github/actions/")):
                  continue
              kind = entry.get("type")
              if kind == "tree":
                  continue
              if kind != "blob":
                  raise SystemExit(f"unsupported head tree entry type for {path!r}")
              mode = entry.get("mode")
              if mode not in ("100644", "100755"):
                  raise SystemExit(f"unsupported head tree mode for {path!r}")
              components = path.split("/")
              if (not components
                      or any(re.fullmatch(r"[A-Za-z0-9._-]+", component) is None
                             for component in components)):
                  raise SystemExit(f"head tree path component is not a full match: {path!r}")
              size = entry.get("size")
              if type(size) is not int or size < 0:
                  raise SystemExit(f"head tree size is unreadable for {path!r}")
              if size > 1024 * 1024:
                  raise SystemExit(f"head tree file is over 1 MiB: {path!r}")
              kept.append((path, components, size, entry["sha"]))
          if len(kept) > 100:
              raise SystemExit("head workflow file count exceeds 100")
          if sum(size for _, _, size, _ in kept) > 4 * 1024 * 1024:
              raise SystemExit("head workflow files exceed the 4 MiB total bound")
          for path, components, size, blob in kept:
              payload = api(f"repos/{repo}/git/blobs/{blob}")
              encoded = payload.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit(f"head blob has no content for {path!r}")
              try:
                  data = base64.b64decode("".join(encoded.split()), validate=True)
              except ValueError as error:
                  raise SystemExit(f"head blob is not valid base64 for {path!r}: {error}") from error
              if len(data) != size:
                  raise SystemExit(f"head blob size differs from the tree for {path!r}")
              destination = root.joinpath(*components)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

      - name: Run the main tree admission rules
        env:
          RULES_ROOT: ${{ runner.temp }}/gke-pr-rules
        run: python3 scripts/ci_preflight.py --rules-only --workflows-dir "$RULES_ROOT"

      - name: Admit the immutable head
        id: allowed
        if: ${{ success() }}
        run: echo "allowed=true" >> "$GITHUB_OUTPUT"

  preflight:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' }}
    runs-on: gke-8cpu-16gb-amd64
    permissions: {contents: read}
    steps:
      - name: Checkout the admitted head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install workflow linters
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          tools_dir="$RUNNER_TEMP/gke-pr-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Run the class-specific preflight
        env:
          TIER: ${{ (needs.admit.outputs.docs_only == 'true' || needs.admit.outputs.github_only == 'true') && 'github-only' || 'fast' }}
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight --tier "$TIER"

  build:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' && needs.admit.outputs.docs_only != 'true' && needs.admit.outputs.github_only != 'true' }}
    runs-on: gke-32cpu-64gb-amd64
    permissions: {contents: read}
    steps:
      - name: Checkout the admitted head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache
      - name: Verify Release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPINEFORGE_VERSION_SOURCE=FILE \
            -DPython3_EXECUTABLE="$(command -v python3)" -DPINEFORGE_BUILD_TESTS=ON \
            -DPINEFORGE_BUILD_SOURCE_LAYER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_BUILD_LIVE_RUNNER=OFF -DPINEFORGE_BUILD_CORPUS_STRATEGIES=OFF \
            -DPINEFORGE_BUILD_EXAMPLES=OFF -DPINEFORGE_REQUIRE_ABI_RECEIPTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target pineforge_pr_smoke --parallel "$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build -L '^fast$' --output-on-failure --no-tests=error \
            --parallel "$(getconf _NPROCESSORS_ONLN)" --output-junit build/ctest-junit.xml

  build-debug:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' && needs.admit.outputs.docs_only != 'true' && needs.admit.outputs.github_only != 'true' }}
    runs-on: gke-16cpu-32gb-amd64
    permissions: {contents: read}
    steps:
      - name: Checkout the admitted head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache
      - name: Verify Debug
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPINEFORGE_VERSION_SOURCE=FILE \
            -DPython3_EXECUTABLE="$(command -v python3)" -DPINEFORGE_BUILD_TESTS=ON \
            -DPINEFORGE_BUILD_SOURCE_LAYER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_BUILD_LIVE_RUNNER=OFF -DPINEFORGE_BUILD_CORPUS_STRATEGIES=OFF \
            -DPINEFORGE_BUILD_EXAMPLES=OFF -DPINEFORGE_REQUIRE_ABI_RECEIPTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target pineforge_pr_smoke --parallel "$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build -L '^fast$' --output-on-failure --no-tests=error \
            --parallel "$(getconf _NPROCESSORS_ONLN)" --output-junit build/ctest-junit.xml

  build-arm:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' && needs.admit.outputs.docs_only != 'true' && needs.admit.outputs.github_only != 'true' && needs.admit.outputs.arm_relevant == 'true' }}
    runs-on: gke-16cpu-32gb-arm64
    permissions: {contents: read}
    steps:
      - name: Require the arm64 machine
        run: |
          test "$(uname -m)" = aarch64
      - name: Checkout the admitted head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the CTest pytest runner
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache strace
      - name: Verify Debug
        run: |
          python3 scripts/ci_verify.py debug --build-dir build --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache

  corpus-parity-subset:
    needs: [admit]
    if: ${{ needs.admit.outputs.allowed == 'true' && needs.admit.outputs.docs_only != 'true' && needs.admit.outputs.github_only != 'true' }}
    runs-on: gke-8cpu-16gb-amd64
    permissions: {contents: read}
    steps:
      - name: Checkout the admitted head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev ccache git-lfs
      - name: Resolve and check out the corpus
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          gitlink="$(git rev-parse HEAD:corpus)"
          git submodule update --init corpus
          test "$(git -C corpus rev-parse HEAD)" = "$gitlink"
          git -C corpus lfs pull
      - name: Check TradingView parity over the pull-request subset
        env:
          BUILD_DIR: build-corpus-parity-subset
        run: JOBS="$(getconf _NPROCESSORS_ONLN)" ./scripts/check_corpus_parity.sh --subset
      - name: Retain parity diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gke-pr-corpus-parity-subset-diagnostics
          path: build-corpus-parity-subset/
          if-no-files-found: warn

  legs:
    needs: [admit, build, build-debug, build-arm, corpus-parity-subset]
    if: ${{ always() && needs.admit.outputs.allowed == 'true' && needs.admit.outputs.docs_only != 'true' && needs.admit.outputs.github_only != 'true' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every proof leg
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEBUG_RESULT: ${{ needs.build-debug.result }}
          ARM_RESULT: ${{ needs.build-arm.result }}
          ARM_RELEVANT: ${{ needs.admit.outputs.arm_relevant }}
          PARITY_RESULT: ${{ needs.corpus-parity-subset.result }}
        run: |
          set -euo pipefail
          arm_passed() {
            case "$1:$2" in
              true:success|false:success|false:skipped) return 0 ;;
              *) return 1 ;;
            esac
          }
          test "$BUILD_RESULT" = success
          test "$DEBUG_RESULT" = success
          arm_passed "$ARM_RELEVANT" "$ARM_RESULT"
          test "$PARITY_RESULT" = success

  result:
    needs: [admit, preflight, legs]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - name: Checkout the base classifier
        if: ${{ needs.admit.result == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-read the payload-bound compare list
        id: second-classify
        if: ${{ needs.admit.result == 'success' }}
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ needs.admit.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PATH_FILE: ${{ runner.temp }}/gke-pr-result-paths
        shell: python3 {0}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          paths = []
          endpoint = (f"repos/{os.environ['REPO']}/compare/"
                      f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}")
          response = json.loads(subprocess.run(
              ["gh", "api", endpoint], check=True,
              capture_output=True, text=True).stdout)
          rows = response.get("files")
          if not isinstance(rows, list):
              raise SystemExit("second compare response is unreadable")
          if len(rows) >= 300:
              raise SystemExit("second compare response is truncated at 300 files")
          for row in rows:
              if not isinstance(row, dict):
                  raise SystemExit("second compare response has an unreadable file row")
              filename = row.get("filename")
              if (not isinstance(filename, str) or "\x00" in filename
                      or any(part in ("", ".", "..") for part in filename.split("/"))):
                  raise SystemExit("second compare filename is unreadable")
              paths.append(filename)
              if row.get("status") == "renamed" and "previous_filename" not in row:
                  raise SystemExit("second compare response is missing a rename origin")
              if "previous_filename" in row:
                  previous = row["previous_filename"]
                  if (not isinstance(previous, str) or "\x00" in previous
                          or any(part in ("", ".", "..") for part in previous.split("/"))):
                      raise SystemExit("second previous filename is unreadable")
                  paths.append(previous)
          if not paths:
              raise SystemExit("second compare response has no changed paths")
          Path(os.environ["PATH_FILE"]).write_bytes(
              b"\0".join(path.encode("utf-8") for path in paths)
              + (b"\0" if paths else b""))
          subprocess.run(["python3", "scripts/ci_docs_only.py",
                          "--paths", os.environ["PATH_FILE"],
                          "--github-output", os.environ["GITHUB_OUTPUT"]],
                         check=True)

      - name: Apply the one-way code-extension veto
        id: veto
        if: ${{ needs.admit.result == 'success' }}
        env:
          PATH_FILE: ${{ runner.temp }}/gke-pr-result-paths
        shell: python3 {0}
        run: |
          import os
          from pathlib import Path

          data = Path(os.environ["PATH_FILE"]).read_bytes()
          paths = [] if not data else [item.decode("utf-8") for item in data.rstrip(b"\0").split(b"\0")]
          extensions = {".cpp", ".hpp", ".h", ".c", ".cc", ".cmake", ".py", ".sh", ".txt"}
          code = any(Path(path).suffix in extensions and not path.startswith("docs/")
                     for path in paths)
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(
              f"code_extension={'true' if code else 'false'}\n")

      - name: Require an independently consistent successful result
        if: always()
        env:
          ADMIT_RESULT: ${{ needs.admit.result }}
          ALLOWED: ${{ needs.admit.outputs.allowed }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LEGS_RESULT: ${{ needs.legs.result }}
          ADMIT_DOCS_ONLY: ${{ needs.admit.outputs.docs_only }}
          ADMIT_GITHUB_ONLY: ${{ needs.admit.outputs.github_only }}
          ADMIT_ARM_RELEVANT: ${{ needs.admit.outputs.arm_relevant }}
          SECOND_DOCS_ONLY: ${{ steps.second-classify.outputs.docs_only }}
          SECOND_GITHUB_ONLY: ${{ steps.second-classify.outputs.github_only }}
          SECOND_ARM_RELEVANT: ${{ steps.second-classify.outputs.arm_relevant }}
          CODE_EXTENSION: ${{ steps.veto.outputs.code_extension }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=gke-pr result::$1"; exit 1; }
          test "$ADMIT_RESULT" = success || fail "admission refused"
          test "$ALLOWED" = true || fail "admission did not allow the head"
          test "$PREFLIGHT_RESULT" = success || fail "preflight did not pass"
          test "$SECOND_DOCS_ONLY" = "$ADMIT_DOCS_ONLY" || fail "docs-only classification changed"
          test "$SECOND_GITHUB_ONLY" = "$ADMIT_GITHUB_ONLY" || fail "github-only classification changed"
          test "$SECOND_ARM_RELEVANT" = "$ADMIT_ARM_RELEVANT" || fail "arm relevance classification changed"
          case "$ADMIT_ARM_RELEVANT" in
            true|false) ;;
            *) fail "arm relevance classification is unanswered" ;;
          esac
          test "$CODE_EXTENSION" != true || {
            test "$ADMIT_DOCS_ONLY" != true || fail "code extension vetoed docs-only classification"
            test "$ADMIT_GITHUB_ONLY" != true || fail "code extension vetoed github-only classification"
          }
          if test "$ADMIT_DOCS_ONLY" = true || test "$ADMIT_GITHUB_ONLY" = true; then
            test "$LEGS_RESULT" = skipped || fail "proof legs were not skipped for a classified documentation class"
          else
            test "$LEGS_RESULT" = success || fail "proof legs did not pass"
          fi
