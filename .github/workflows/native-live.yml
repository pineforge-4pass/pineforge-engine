name: Native live runner

on:
  workflow_call:
    inputs:
      exclude_slow:
        description: Exclude measured slow CTest rows in the caller's PR run
        type: boolean
        default: false
      cold_cache:
        description: Bypass compiler and libcurl cache restore and save for every profile
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Prove the full row set without compiler or libcurl caches
        type: boolean
        default: false

permissions:
  contents: read

# A reusable workflow's github.workflow is its caller, so use a distinct prefix.
# Only post-merge callers and main/manual runs use this workflow.
# Native shards and both sanitizer profiles use the post-merge GCP fleet.
concurrency:
  group: native-live-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # A reusable workflow does not inherit the caller's environment. The guards
  # require the release tags fetched by every profile's full checkout.
  PINEFORGE_REQUIRE_RELEASE_TAGS: "1"

jobs:
  authz:
    name: authz
    # Fleet routing is fixed for this workflow; releases use pf-gcp-main.
    runs-on: ubuntu-24.04
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # Bind identity to the triggering run and its re-runner.
              # These two App bots are fixed canon policy; ALLOWED_BOTS is PR-only.
              [ -n "${WR_HEAD_REPO:-}" ] || fail "workflow_run head repository is missing"
              [ -n "${WR_ACTOR:-}" ] || fail "workflow_run triggering actor is missing"
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run head repository does not match this repository"
              case "$WR_ACTOR" in
                "pineforge-app[bot]"|"pineforge-ci-dispatcher[bot]") ;;
                *"[bot]") fail "workflow_run bot is not on the canon allowlist" ;;
                *)
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null) || fail "workflow_run permission lookup failed"
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor does not have write permission" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  native-live:
    name: native-live (${{ matrix.profile }})
    needs: [authz]
    # Each instrumented tree builds once on the post-merge GCP fleet.
    runs-on: ["self-hosted","pf-gcp-post"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: live-sanitizers
            build_dir: build-live-sanitizers
          - profile: live-tsan
            build_dir: build-live-tsan
    # Keep every runner row and let the platform supply its own job maximum.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # pytest for the CTest rows that run `python -m pytest` (tests/CMakeLists.txt:
      # test_run_json_selected_window, test_compile_inventory_pipeline), the same
      # hash-pinned wheels as the preflight job. A failed install fails the job.
      - name: Install the CTest pytest runner
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache git-lfs strace

      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-

      - name: Set up pinned WebSocket-enabled libcurl
        id: curl-deps
        uses: ./.github/actions/setup-live-curl
        with:
          cache-namespace: ${{ matrix.profile }}
          cold-cache: ${{ inputs.cold_cache }}

      - name: Record compiler cache before verification
        run: |
          mkdir -p "${{ matrix.build_dir }}"
          ccache --show-stats > "${{ matrix.build_dir }}/ccache-before.log"
          ccache --zero-stats

      - name: Verify (${{ matrix.profile }})
        id: verify
        run: python3 scripts/ci_verify.py ${{ matrix.profile }} --build-dir ${{ matrix.build_dir }} --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache

      - name: Stage and summarize diagnostics
        if: always()
        env:
          CURL_CACHE_HIT: ${{ steps.curl-deps.outputs.cache-hit }}
          CCACHE_CACHE_HIT: ${{ steps.ccache-restore.outputs.cache-hit }}
          CCACHE_RESTORE_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
          COLD_CACHE: ${{ inputs.cold_cache }}
        run: |
          python3 scripts/collect_ci_diagnostics.py --build-dir ${{ matrix.build_dir }} --profile ${{ matrix.profile }} --dependency-dir build-native-deps
          printf 'cold_cache=%s\ncompiler_exact_hit=%s\ncompiler_restore_key=%s\n' "$COLD_CACHE" "$CCACHE_CACHE_HIT" "$CCACHE_RESTORE_KEY" > ci-diagnostics/cache-info.txt
          if [[ -f "${{ matrix.build_dir }}/ccache-before.log" ]]; then
            cp "${{ matrix.build_dir }}/ccache-before.log" ci-diagnostics/ccache-before.log
          fi

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-native-live-${{ matrix.profile }}
          path: ci-diagnostics/
          if-no-files-found: warn

      # A failing test does not invalidate compiler objects. Save explicitly
      # after diagnostics, even on normal failure; cancellation is no cache plan.
      - name: Save ccache after verification
        if: ${{ !cancelled() && !inputs.cold_cache && steps.verify.outcome != 'skipped' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  native-live-shards:
    name: native-live-shard (${{ matrix.profile }}, ${{ matrix.shard }}/4)
    needs: [authz]
    runs-on: ["self-hosted","pf-gcp-post"]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        include:
          - profile: native
            build_dir: build-live
    outputs:
      shard_1: ${{ steps.shard-proof.outputs.shard_1 }}
      shard_2: ${{ steps.shard-proof.outputs.shard_2 }}
      shard_3: ${{ steps.shard-proof.outputs.shard_3 }}
      shard_4: ${{ steps.shard-proof.outputs.shard_4 }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the CTest pytest runner
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache git-lfs strace

      # Each shard has its own save key; four cold builds cannot reserve one key.
      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-shard-${{ matrix.shard }}-

      - name: Set up pinned WebSocket-enabled libcurl
        id: curl-deps
        uses: ./.github/actions/setup-live-curl
        with:
          cache-namespace: ${{ matrix.profile }}
          cold-cache: ${{ inputs.cold_cache }}

      - name: Record compiler cache before verification
        run: |
          mkdir -p "${{ matrix.build_dir }}"
          ccache --show-stats > "${{ matrix.build_dir }}/ccache-before.log"
          ccache --zero-stats

      - name: Verify (${{ matrix.profile }}, ${{ matrix.shard }}/4)
        id: verify
        run: python3 scripts/ci_verify.py ${{ matrix.profile }} --build-dir ${{ matrix.build_dir }} --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache --require-websocket ${{ matrix.profile == 'native' && inputs.exclude_slow && '--exclude-label slow' || '' }} --ctest-shard ${{ matrix.shard }}/4

      - name: Stage and summarize diagnostics
        if: always()
        env:
          CURL_CACHE_HIT: ${{ steps.curl-deps.outputs.cache-hit }}
          CCACHE_CACHE_HIT: ${{ steps.ccache-restore.outputs.cache-hit }}
          CCACHE_RESTORE_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
          COLD_CACHE: ${{ inputs.cold_cache }}
        run: |
          python3 scripts/collect_ci_diagnostics.py --build-dir ${{ matrix.build_dir }} --profile ${{ matrix.profile }} --dependency-dir build-native-deps
          printf 'cold_cache=%s\ncompiler_exact_hit=%s\ncompiler_restore_key=%s\n' "$COLD_CACHE" "$CCACHE_CACHE_HIT" "$CCACHE_RESTORE_KEY" > ci-diagnostics/cache-info.txt
          if [[ -f "${{ matrix.build_dir }}/ccache-before.log" ]]; then
            cp "${{ matrix.build_dir }}/ccache-before.log" ci-diagnostics/ccache-before.log
          fi

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-native-live-${{ matrix.profile }}-${{ matrix.shard }}of4
          path: ci-diagnostics/
          if-no-files-found: warn

      - name: Save ccache after verification
        if: ${{ !cancelled() && !inputs.cold_cache && steps.verify.outcome != 'skipped' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Record native shard proof
        id: shard-proof
        shell: python
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          import json
          import os
          from pathlib import Path
          source = Path("build-live/ci-summary.json")
          print(f"Reading native shard proof: {source}", flush=True)
          summary = json.loads(source.read_text())
          index = int(os.environ["SHARD_INDEX"])
          if (summary.get("profile") != "native" or summary.get("status") != "passed"
                  or type(summary.get("exitCode")) is not int or summary["exitCode"] != 0
                  or summary.get("failures") != []
                  or summary.get("ctestShard") != {"index": index, "count": 4}):
              raise SystemExit("native shard summary did not pass")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"shard_{index}=success\n")

  native-live-native:
    name: native-live (native)
    needs: [authz, native-live-shards]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every native shard to have passed
        env:
          AUTHZ_RESULT: ${{ needs.authz.result }}
          SHARDS_RESULT: ${{ needs.native-live-shards.result }}
          SHARD_1_RESULT: ${{ needs.native-live-shards.outputs.shard_1 }}
          SHARD_2_RESULT: ${{ needs.native-live-shards.outputs.shard_2 }}
          SHARD_3_RESULT: ${{ needs.native-live-shards.outputs.shard_3 }}
          SHARD_4_RESULT: ${{ needs.native-live-shards.outputs.shard_4 }}
        run: |
          printf 'native shards: %s\n' "$SHARDS_RESULT"
          if test "$SHARDS_RESULT" = cancelled; then
            printf 'HANG (re-run): a native shard job was cancelled\n'
          fi
          test "$AUTHZ_RESULT" = success
          test "$SHARDS_RESULT" = success
          test "$SHARD_1_RESULT" = success
          test "$SHARD_2_RESULT" = success
          test "$SHARD_3_RESULT" = success
          test "$SHARD_4_RESULT" = success

  native-live-gate:
    needs: [authz, native-live, native-live-native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every native profile to have passed
        env:
          AUTHZ_RESULT: ${{ needs.authz.result }}
          PROFILES_RESULT: ${{ needs.native-live.result }}
          NATIVE_RESULT: ${{ needs.native-live-native.result }}
        run: |
          printf 'native profiles: %s\n' "$PROFILES_RESULT"
          printf 'native shard aggregate: %s\n' "$NATIVE_RESULT"
          if test "$PROFILES_RESULT" = cancelled || test "$NATIVE_RESULT" = cancelled; then
            printf 'HANG (re-run): a native profile job was cancelled, which is how the platform stops a job at its 360-minute maximum\n'
          fi
          test "$AUTHZ_RESULT" = success
          test "$PROFILES_RESULT" = success
          test "$NATIVE_RESULT" = success
