name: Native live runner

on:
  workflow_call:
    inputs:
      exclude_slow:
        description: Exclude measured slow CTest rows in the caller's PR run
        type: boolean
        default: false
      cold_cache:
        description: Bypass compiler and libcurl cache restore and save for every profile
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Prove the full row set without compiler or libcurl caches
        type: boolean
        default: false

permissions:
  contents: read

# The caller owns PR cancellation. A reusable workflow's github.workflow is
# its caller, so the prefix avoids cancelling CI. Main/manual runs are unique.
concurrency:
  group: native-live-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # A reusable workflow does not inherit the caller's environment. The guards
  # require the release tags fetched by every profile's full checkout.
  PINEFORGE_REQUIRE_RELEASE_TAGS: "1"

jobs:
  native-live:
    name: native-live (${{ matrix.profile }})
    # The live ci-spot build class, with the public fragment's hosted fallback.
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64-16"]') || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: native
            build_dir: build-live
          - profile: live-sanitizers
            build_dir: build-live-sanitizers
          - profile: live-tsan
            build_dir: build-live-tsan
    # 360 minutes is GitHub's job maximum. It is deliberately the ONLY time
    # limit here (owner rule, 2026-10-12): the old 75/45/45-minute budgets and
    # the verifier's 2700/2820 and 900/1200-second row and stage deadlines
    # cut off runs whose own rows were merely slow -- main's 2820s stage
    # deadline refused this very row set's 3600s TIMEOUT property -- so no
    # stage, step or row carries a bound of ours any more. Only a hang reaches
    # the platform maximum. No row inventory changes.
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64-16"]'
      CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pytest for the CTest rows that run `python -m pytest` (tests/CMakeLists.txt:
      # test_run_json_selected_window, test_compile_inventory_pipeline), the same
      # hash-pinned wheels as the preflight job. A failed install fails the job.
      - name: Install the CTest pytest runner
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache

      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-

      - name: Set up pinned WebSocket-enabled libcurl
        id: curl-deps
        uses: ./.github/actions/setup-live-curl
        with:
          cache-namespace: ${{ matrix.profile }}
          cold-cache: ${{ inputs.cold_cache }}

      - name: Record compiler cache before verification
        run: |
          mkdir -p "${{ matrix.build_dir }}"
          ccache --show-stats > "${{ matrix.build_dir }}/ccache-before.log"
          ccache --zero-stats

      - name: Verify (${{ matrix.profile }})
        id: verify
        run: python3 scripts/ci_verify.py ${{ matrix.profile }} --build-dir ${{ matrix.build_dir }} --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache ${{ matrix.profile == 'native' && '--require-websocket' || '' }} ${{ matrix.profile == 'native' && inputs.exclude_slow && '--exclude-label slow' || '' }}

      - name: Stage and summarize diagnostics
        if: always()
        env:
          CURL_CACHE_HIT: ${{ steps.curl-deps.outputs.cache-hit }}
          CCACHE_CACHE_HIT: ${{ steps.ccache-restore.outputs.cache-hit }}
          CCACHE_RESTORE_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
          COLD_CACHE: ${{ inputs.cold_cache }}
        run: |
          python3 scripts/collect_ci_diagnostics.py --build-dir ${{ matrix.build_dir }} --profile ${{ matrix.profile }} --dependency-dir build-native-deps
          printf 'cold_cache=%s\ncompiler_exact_hit=%s\ncompiler_restore_key=%s\n' "$COLD_CACHE" "$CCACHE_CACHE_HIT" "$CCACHE_RESTORE_KEY" > ci-diagnostics/cache-info.txt
          if [[ -f "${{ matrix.build_dir }}/ccache-before.log" ]]; then
            cp "${{ matrix.build_dir }}/ccache-before.log" ci-diagnostics/ccache-before.log
          fi

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-native-live-${{ matrix.profile }}
          path: ci-diagnostics/
          if-no-files-found: warn

      # A failing test does not invalidate compiler objects. Save explicitly
      # after diagnostics, even on normal failure; cancellation is no cache plan.
      - name: Save ccache after verification
        if: ${{ !cancelled() && !inputs.cold_cache && steps.verify.outcome != 'skipped' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  native-live-gate:
    needs: native-live
    if: always()
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-24.04' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 360
    steps:
      - name: Require every native profile to have passed
        env:
          PROFILES_RESULT: ${{ needs.native-live.result }}
        run: |
          printf 'native profiles: %s\n' "$PROFILES_RESULT"
          if test "$PROFILES_RESULT" = cancelled; then
            printf 'HANG (re-run): a native profile job was cancelled, which is how the platform stops a job at its 360-minute maximum\n'
          fi
          test "$PROFILES_RESULT" = success
