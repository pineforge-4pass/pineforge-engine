name: Native live runner

on:
  workflow_call:
    inputs:
      exclude_slow:
        description: Exclude measured slow CTest rows in the caller's PR run
        type: boolean
        default: false
      cold_cache:
        description: Bypass compiler and libcurl cache restore and save for every profile
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Prove the full row set without compiler or libcurl caches
        type: boolean
        default: false

permissions:
  contents: read

# The caller owns PR cancellation. A reusable workflow's github.workflow is
# its caller, so the prefix avoids cancelling CI. Main/manual runs are unique.
concurrency:
  group: native-live-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # A reusable workflow does not inherit the caller's environment. The guards
  # require the release tags fetched by every profile's full checkout.
  PINEFORGE_REQUIRE_RELEASE_TAGS: "1"

jobs:
  native-live:
    name: native-live (${{ matrix.profile }})
    # Same trusted-event 16-core policy as CI; forks use the standard runner.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'pf-linux-x64-16' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: native
            build_dir: build-live
            job_minutes: 75
            verify_minutes: 65
            test_timeout: 2100
            ctest_timeout: 2400
          - profile: live-sanitizers
            build_dir: build-live-sanitizers
            job_minutes: 45
            verify_minutes: 35
            test_timeout: 900
            ctest_timeout: 1200
          - profile: live-tsan
            build_dir: build-live-tsan
            job_minutes: 45
            verify_minutes: 35
            test_timeout: 900
            ctest_timeout: 1200
    # Main runs 37398893123/37461653250/37478400505 took 35.4–40.7m
    # native + 15.1–16.3m ASan before TSan exhausted the shared hour, despite
    # compiler and curl cache hits. Independent 75/45/45m budgets allow cold
    # builds and leave ten minutes outside verification for setup/collection.
    # Native's slowest measured row was 1695s; its 2100s default deadline has
    # 24% margin, within a 2400s CTest stage. Live rows already allow up to
    # 900s; keep those limits and a 1200s stage. No row inventory changes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache

      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-live-v2-${{ matrix.profile }}-

      - name: Set up pinned WebSocket-enabled libcurl
        id: curl-deps
        uses: ./.github/actions/setup-live-curl
        with:
          cache-namespace: ${{ matrix.profile }}
          cold-cache: ${{ inputs.cold_cache }}

      - name: Record compiler cache before verification
        run: |
          mkdir -p "${{ matrix.build_dir }}"
          ccache --show-stats > "${{ matrix.build_dir }}/ccache-before.log"
          ccache --zero-stats

      - name: Verify (${{ matrix.profile }})
        id: verify
        timeout-minutes: ${{ matrix.verify_minutes }}
        run: python3 scripts/ci_verify.py ${{ matrix.profile }} --build-dir ${{ matrix.build_dir }} --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache --test-timeout ${{ matrix.test_timeout }} --ctest-timeout ${{ matrix.ctest_timeout }} ${{ matrix.profile == 'native' && '--require-websocket' || '' }} ${{ matrix.profile == 'native' && inputs.exclude_slow && '--exclude-label slow' || '' }}

      - name: Stage and summarize diagnostics
        if: always()
        env:
          CURL_CACHE_HIT: ${{ steps.curl-deps.outputs.cache-hit }}
          CCACHE_CACHE_HIT: ${{ steps.ccache-restore.outputs.cache-hit }}
          CCACHE_RESTORE_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
          COLD_CACHE: ${{ inputs.cold_cache }}
        run: |
          python3 scripts/collect_ci_diagnostics.py --build-dir ${{ matrix.build_dir }} --profile ${{ matrix.profile }} --dependency-dir build-native-deps
          printf 'cold_cache=%s\ncompiler_exact_hit=%s\ncompiler_restore_key=%s\n' "$COLD_CACHE" "$CCACHE_CACHE_HIT" "$CCACHE_RESTORE_KEY" > ci-diagnostics/cache-info.txt
          if [[ -f "${{ matrix.build_dir }}/ccache-before.log" ]]; then
            cp "${{ matrix.build_dir }}/ccache-before.log" ci-diagnostics/ccache-before.log
          fi

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-native-live-${{ matrix.profile }}
          path: ci-diagnostics/
          if-no-files-found: warn

      # A failing test does not invalidate compiler objects. Save explicitly
      # after diagnostics, even on normal failure; cancellation is no cache plan.
      - name: Save ccache after verification
        if: ${{ !cancelled() && !inputs.cold_cache && steps.verify.outcome != 'skipped' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  native-live-gate:
    needs: native-live
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native profile to have passed
        env:
          PROFILES_RESULT: ${{ needs.native-live.result }}
        run: |
          printf 'native profiles: %s\n' "$PROFILES_RESULT"
          test "$PROFILES_RESULT" = success
