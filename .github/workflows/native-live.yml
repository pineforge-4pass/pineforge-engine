name: Native live runner

on:
  workflow_call:
    inputs:
      exclude_slow:
        description: Exclude measured slow CTest rows in the caller's PR run
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# The caller owns PR cancellation. Keep a distinct group: github.workflow in
# a reusable workflow names the caller, so an unprefixed group would collide
# with CI and could cancel it. Main/manual proof groups stay unique per run.
concurrency:
  group: native-live-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  CURL_VERSION: "8.14.1"
  CURL_SHA256: "f4619a1e2474c4bbfedc88a7c2191209c8334b48fa1f4e53fd584cc12e9120dd"

# The organization's 16-core larger runner for a push, the schedule, a
# dispatch and a pull request from a branch of this repository; every other
# event, a fork's pull request above all, runs on the free standard runner. In
# a workflow_call the github context is the caller's, so a fork's pull request
# through CI lands there too. scripts/ci_preflight.py pins the runner and limit.
jobs:
  native-live:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'pf-linux-x64-16' || 'ubuntu-24.04' }}
    # The full set waits on the test_ci_verify CTest row, 1034 s on the
    # standard runner at 0d76a099, which more cores do not shorten.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0   # ci_verify runs the benchmark provenance CTest row

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tzdata-legacy carries the backward links test_native_calendar resolves
      # (US/Eastern, Japan, GB); noble split them out of tzdata, and this job
      # runs the calendar row too.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-native-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-native-

      - name: Identify native dependency environment
        id: native-deps
        shell: bash
        run: |
          mkdir -p build-native-deps
          {
            printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "${GITHUB_WORKSPACE}"
            cc --version
            cmake --version
            dpkg-query -W libssl-dev zlib1g-dev
          } > build-native-deps/environment.txt
          echo "identity=$(sha256sum build-native-deps/environment.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned WebSocket-enabled libcurl
        id: curl-cache
        uses: actions/cache@v4
        with:
          path: build-native-deps/curl-install
          key: curl-${{ env.CURL_VERSION }}-${{ env.CURL_SHA256 }}-${{ steps.native-deps.outputs.identity }}-${{ hashFiles('.github/workflows/native-live.yml') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build pinned WebSocket-enabled libcurl
        env:
          CURL_CACHE_HIT: ${{ steps.curl-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          cmake_file="build-native-deps/curl-install/lib/cmake/CURL/CURLConfig.cmake"
          if [[ "${CURL_CACHE_HIT}" == "true" && -f "$cmake_file" ]]; then
            echo "Using cached libcurl at ${cmake_file}"
            exit 0
          fi
          mkdir -p build-native-deps
          cd build-native-deps
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.xz" -o curl.tar.xz
          echo "${CURL_SHA256}  curl.tar.xz" | sha256sum -c -
          tar -xf curl.tar.xz
          cmake -S "curl-${CURL_VERSION}" -B curl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/curl-install" \
            -DBUILD_CURL_EXE=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON \
            -DBUILD_TESTING=OFF -DCURL_USE_OPENSSL=ON -DENABLE_WEBSOCKETS=ON \
            -DHTTP_ONLY=ON -DCURL_USE_LIBPSL=OFF -DUSE_LIBIDN2=OFF \
            -DCURL_USE_LIBSSH2=OFF -DCURL_BROTLI=OFF -DCURL_ZSTD=OFF \
            2>&1 | tee curl-configure.log
          cmake --build curl-build -j 4 2>&1 | tee curl-build.log
          cmake --install curl-build 2>&1 | tee curl-install.log

      - name: Verify native live
        run: python3 scripts/ci_verify.py native --build-dir build-live --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ github.workspace }}/build-native-deps/curl-install/lib/cmake/CURL" --ccache --require-websocket ${{ inputs.exclude_slow && '--exclude-label slow' || '' }}

      - name: Stage and summarize diagnostics
        if: always()
        env:
          CURL_CACHE_HIT: ${{ steps.curl-cache.outputs.cache-hit }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-live --profile native --dependency-dir build-native-deps

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-native-live
          path: ci-diagnostics/
          if-no-files-found: warn
