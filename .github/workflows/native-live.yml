name: Native live runner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev libsqlite3-dev libssl-dev zlib1g-dev
      - name: Build pinned WebSocket-enabled libcurl
        run: |
          mkdir -p build-native-deps
          cd build-native-deps
          curl --fail --location --proto '=https' --tlsv1.2 https://curl.se/download/curl-8.14.1.tar.xz -o curl.tar.xz
          echo 'f4619a1e2474c4bbfedc88a7c2191209c8334b48fa1f4e53fd584cc12e9120dd  curl.tar.xz' | sha256sum -c -
          tar -xf curl.tar.xz
          cmake -S curl-8.14.1 -B curl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/curl-install" \
            -DBUILD_CURL_EXE=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON \
            -DBUILD_TESTING=OFF -DCURL_USE_OPENSSL=ON -DENABLE_WEBSOCKETS=ON \
            -DHTTP_ONLY=ON -DCURL_USE_LIBPSL=OFF -DUSE_LIBIDN2=OFF \
            -DCURL_USE_LIBSSH2=OFF -DCURL_BROTLI=OFF -DCURL_ZSTD=OFF
          cmake --build curl-build -j 4
          cmake --install curl-build
      - name: Build native runner and tests
        run: |
          cmake -S . -B build-live -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPINEFORGE_BUILD_LIVE_RUNNER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DCURL_DIR="$PWD/build-native-deps/curl-install/lib/cmake/CURL"
          cmake --build build-live -j 4
      - name: Prepare real R2 settlement ABI provider
        run: |
          python3 scripts/prepare_settlement_cpp_abi_base.py --source-repo . \
            --current-build build-live --output build-live/settlement-abi-base --jobs 4
      - name: Test native engine, parser, journal and transports
        run: |
          ctest --test-dir build-live --output-on-failure -j 4
          # This required lane uses the pinned WS-enabled curl. A skip is not
          # sufficient here even though ordinary system-curl builds may skip.
          build-live/bin/test_native_live_websocket
          python3 scripts/check_c_abi_runtime.py
          python3 scripts/check_broker_state_hash_coverage.py
      - name: Install native executable
        run: |
          cmake --install build-live --prefix "$PWD/build-live/install"
          build-live/install/bin/pineforge-live --help
