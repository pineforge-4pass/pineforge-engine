name: Native live runner

on:
  workflow_call:
    inputs:
      exclude_slow:
        description: Exclude measured slow CTest rows in the caller's PR run
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# The caller owns PR cancellation. Keep a distinct group: github.workflow in
# a reusable workflow names the caller, so an unprefixed group would collide
# with CI and could cancel it. Main/manual proof groups stay unique per run.
concurrency:
  group: native-live-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # The run-failure source guards in every ci_verify profile read the newest
  # release tag, which this checkout fetches (fetch-depth: 0): a missing tag
  # fails them rather than taking their tag-less offline path. A called
  # workflow does not inherit CI's env, so it says so itself.
  PINEFORGE_REQUIRE_RELEASE_TAGS: "1"

# The organization's 16-core larger runner for a push, the schedule, a
# dispatch and a pull request from a branch of this repository; every other
# event, a fork's pull request above all, runs on the free standard runner. In
# a workflow_call the github context is the caller's, so a fork's pull request
# through CI lands there too. scripts/ci_preflight.py pins the runner and limit.
jobs:
  native-live:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'pf-linux-x64-16' || 'ubuntu-24.04' }}
    # The full set waits on the test_ci_verify CTest row, 1034 s on the
    # standard runner at 0d76a099, which more cores do not shorten.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0   # ci_verify runs the benchmark provenance CTest row

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tzdata-legacy carries the backward links test_native_calendar resolves
      # (US/Eastern, Japan, GB); noble split them out of tzdata, and this job
      # runs the calendar row too.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-native-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-native-

      - name: Set up pinned WebSocket-enabled libcurl
        id: curl-deps
        uses: ./.github/actions/setup-live-curl

      - name: Verify native live
        run: python3 scripts/ci_verify.py native --build-dir build-live --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache --require-websocket ${{ inputs.exclude_slow && '--exclude-label slow' || '' }}

      - name: Verify every live runner target with ASan and UBSan
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_verify.py live-sanitizers --build-dir build-live-sanitizers --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache

      - name: Stage and summarize diagnostics
        if: always()
        env:
          CURL_CACHE_HIT: ${{ steps.curl-deps.outputs.cache-hit }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-live --profile native --dependency-dir build-native-deps

      - name: Verify every live runner target with ThreadSanitizer
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_verify.py live-tsan --build-dir build-live-tsan --jobs "$(getconf _NPROCESSORS_ONLN)" --generator Ninja --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ccache

      - name: Stage thread sanitizer diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-live-tsan --profile live-tsan --output ci-diagnostics/live-tsan --dependency-dir build-native-deps

      - name: Stage live sanitizer diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-live-sanitizers --profile live-sanitizers --output ci-diagnostics/live-sanitizers --dependency-dir build-native-deps

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-native-live
          path: ci-diagnostics/
          if-no-files-found: warn
