name: CI post-merge

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      cold_native_cache:
        description: Run full native profiles without compiler or libcurl caches
        type: boolean
        default: false

permissions:
  contents: read

# Each proof run is unique; newer pushes never cancel queued or running proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

# The canon authz gate admits our events before any checkout.
# Light jobs and per-leg aggregates use bare gke-2cpu-4gb-amd64; Linux proof jobs
# use bare GKE scale-set names with fixed amd64 and arm64 sizes.
# Jobs run directly in runner pods carrying the engine toolchain image and sudo.
# Each verification sizes its parallelism to the runner that took it.
# scripts/ci_preflight.py pins every runner and shard count. GitHub's platform
# maximum remains the only job time limit; docs/ci.md records the policy.
jobs:
  authz:
    name: authz
    # Fleet routing is fixed for this workflow; releases use pf-gcp-main.
    runs-on: gke-2cpu-4gb-amd64
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # LB-437: bind identity to the triggering run and its re-runner.
              # These two App bots are fixed canon policy; ALLOWED_BOTS is PR-only.
              [ -n "${WR_HEAD_REPO:-}" ] || fail "workflow_run head repository is missing"
              [ -n "${WR_ACTOR:-}" ] || fail "workflow_run triggering actor is missing"
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run head repository does not match this repository"
              case "$WR_ACTOR" in
                "pineforge-app[bot]"|"pineforge-ci-dispatcher[bot]") ;;
                *"[bot]") fail "workflow_run bot is not on the canon allowlist" ;;
                *)
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null) || fail "workflow_run permission lookup failed"
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor does not have write permission" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: [authz]
    runs-on: gke-8cpu-16gb-amd64
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64-16"]'
      PINEFORGE_VERIFIER_SLOW: 'true'
      # Source guards require the newest release tag from the full checkout.
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
    # PRs run only source, documentation and policy checks. Build-driving
    # controls and dependency-heavy harness tests live in preflight-slow.
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install workflow linters
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          tools_dir="$RUNNER_TEMP/pineforge-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify workflow wiring and source guards
        if: ${{ needs.authz.result == 'success' }}
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight --tier fast

      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-preflight
          path: build-ci-preflight/
          if-no-files-found: warn

  # CR-233: build-driving controls and the pytest harness run only on full events.
  preflight-slow:
    needs: [authz]
    runs-on: gke-8cpu-16gb-amd64
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the harness test runner
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt
      - name: Verify deferred preflight stages
        if: ${{ needs.authz.result == 'success' }}
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight-slow --tier slow
      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-preflight-slow
          path: build-ci-preflight-slow/
          if-no-files-found: warn

  build:
    name: build-shard (${{ matrix.platform.os }}, ${{ matrix.build_type }}, ${{ matrix.shard }}/4)
    # Proof jobs follow authz and classification alongside preflight. Only a
    # successful docs-only answer skips scheduling.
    needs: [authz]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
        build_type: [Release]
        shard: [1, 2, 3, 4]

    # Four shards divide roughly 15,300 measured CTest row-seconds.
    runs-on: gke-32cpu-64gb-amd64

    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require the requested platform
        if: ${{ needs.authz.result == 'success' }}
        env:
          REQUESTED_PLATFORM: ${{ matrix.platform.os }}
          ACTUAL_OS: ${{ runner.os }}
        run: |
          case "$REQUESTED_PLATFORM:$ACTUAL_OS" in
            ubuntu-24.04:Linux) ;;
            *) echo "::error::runner OS $ACTUAL_OS cannot verify $REQUESTED_PLATFORM"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Only the full profiles run the pytest CTest rows.
      - name: Install the CTest pytest runner
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      # tzdata-legacy carries the backward links test_native_calendar resolves
      # (US/Eastern, Japan, GB); noble split them out of tzdata, and the hosted
      # image happens to have it, so the row stays green on a bare runner too.
      - name: Install dependencies (Linux)
        if: ${{ needs.authz.result == 'success' && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache strace

      # The release profile fails below its CTest row floor (its row of the
      # PRIVATE_FIXTURE_PROFILE_FLOORS table in scripts/ci_verify.py);
      # debug registers a subset of those rows.
      - name: Verify (${{ matrix.build_type }})
        env:
          # The relative runtime witness gates on process CPU time on every
          # Release runner. '1' is the escape -- the row registers
          # --candidate-only, one sample and no
          # ratio -- for a runner whose CPU accounting is unusable; record the
          # measured reason here and in docs/ci.md before setting it.
          PINEFORGE_RUNTIME_BUDGET_CANDIDATE_ONLY: '0'
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 scripts/ci_verify.py ${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --build-dir build --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache --ctest-shard ${{ matrix.shard }}/4

      - name: Stage and summarize diagnostics
        if: ${{ always() && needs.authz.result == 'success' }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-${{ matrix.platform.os }}-${{ matrix.build_type }}-shard-${{ matrix.shard }}-of-4
          path: ci-diagnostics/
          if-no-files-found: warn

  build-debug:
    name: build-shard (${{ matrix.platform.os }}, ${{ matrix.build_type }}, ${{ matrix.shard }}/2)
    needs: [authz]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
        build_type: [Debug]
        shard: [1, 2]
    runs-on: gke-16cpu-32gb-amd64

    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require the requested platform
        if: ${{ needs.authz.result == 'success' }}
        env:
          REQUESTED_PLATFORM: ${{ matrix.platform.os }}
          ACTUAL_OS: ${{ runner.os }}
        run: |
          case "$REQUESTED_PLATFORM:$ACTUAL_OS" in
            ubuntu-24.04:Linux) ;;
            *) echo "::error::runner OS $ACTUAL_OS cannot verify $REQUESTED_PLATFORM"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the CTest pytest runner
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      - name: Install dependencies (Linux)
        if: ${{ needs.authz.result == 'success' && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache strace

      - name: Verify (${{ matrix.build_type }})
        env:
          PINEFORGE_RUNTIME_BUDGET_CANDIDATE_ONLY: '0'
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 scripts/ci_verify.py ${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --build-dir build --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache --ctest-shard ${{ matrix.shard }}/2

      - name: Stage and summarize diagnostics
        if: ${{ always() && needs.authz.result == 'success' }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-${{ matrix.platform.os }}-${{ matrix.build_type }}-shard-${{ matrix.shard }}-of-2
          path: ci-diagnostics/
          if-no-files-found: warn

  build-release-gate:
    name: build (ubuntu-24.04, Release)
    needs: [authz, build]
    if: ${{ !cancelled() && needs.authz.result == 'success' }}
    runs-on: gke-2cpu-4gb-amd64
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every shard to have passed
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "shards: $SHARD_RESULT"
          [[ "$SHARD_RESULT" == "success" ]]

  build-debug-gate:
    name: build (ubuntu-24.04, Debug)
    needs: [authz, build-debug]
    if: ${{ !cancelled() && needs.authz.result == 'success' }}
    runs-on: gke-2cpu-4gb-amd64
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every shard to have passed
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.build-debug.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "shards: $SHARD_RESULT"
          [[ "$SHARD_RESULT" == "success" ]]

  # GKE arm64 cells run the same verification steps as the amd64 post jobs.
  build-arm:
    name: build (ubuntu-24.04-arm, ${{ matrix.build_type }})
    needs: [authz]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    runs-on: gke-16cpu-32gb-arm64

    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require the requested platform
        if: ${{ needs.authz.result == 'success' }}
        env:
          REQUESTED_PLATFORM: ubuntu-24.04-arm
          ACTUAL_OS: ${{ runner.os }}
        run: |
          case "$REQUESTED_PLATFORM:$ACTUAL_OS" in
            ubuntu-24.04-arm:Linux) ;;
            *) echo "::error::runner OS $ACTUAL_OS cannot verify $REQUESTED_PLATFORM"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Only the full profiles run the pytest CTest rows.
      - name: Install the CTest pytest runner
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      # tzdata-legacy carries the backward links test_native_calendar resolves
      # (US/Eastern, Japan, GB); noble split them out of tzdata, and the hosted
      # image happens to have it, so the row stays green on a bare runner too.
      - name: Install dependencies (Linux)
        if: ${{ needs.authz.result == 'success' && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache strace

      # The release profile fails below its CTest row floor (its row of the
      # PRIVATE_FIXTURE_PROFILE_FLOORS table in scripts/ci_verify.py);
      # debug registers a subset of those rows.
      - name: Verify (${{ matrix.build_type }})
        env:
          # The relative runtime witness gates on process CPU time on every
          # Release runner. '1' is the escape -- the row registers
          # --candidate-only, one sample and no
          # ratio -- for a runner whose CPU accounting is unusable; record the
          # measured reason here and in docs/ci.md before setting it.
          PINEFORGE_RUNTIME_BUDGET_CANDIDATE_ONLY: '0'
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 scripts/ci_verify.py ${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --build-dir build --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache

      - name: Stage and summarize diagnostics
        if: ${{ always() && needs.authz.result == 'success' }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-ubuntu-24.04-arm-${{ matrix.build_type }}
          path: ci-diagnostics/
          if-no-files-found: warn

  # Dedicated AddressSanitizer + UndefinedBehaviorSanitizer lane. Without this,
  # the determinism / NaN-propagation / handle-reuse / C-ABI-lifecycle probes
  # would run un-instrumented and could not actually trip the leak / double-free
  # / UB they target. The library is built with the sanitizers PUBLIC so the
  # instrumentation propagates into every test binary (CMakeLists.txt option
  # PINEFORGE_ENABLE_SANITIZERS).
  sanitizers:
    name: sanitizers-shard (${{ matrix.shard }}/4)
    needs: [authz]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: gke-32cpu-64gb-amd64
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # pytest for the CTest rows that run `python -m pytest` (tests/CMakeLists.txt:
      # test_run_json_selected_window, test_compile_inventory_pipeline), the same
      # hash-pinned wheels as the preflight job. A failed install fails the job.
      - name: Install the CTest pytest runner
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      - name: Install dependencies
        if: ${{ needs.authz.result == 'success' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache

      - name: Verify (sanitizers)
        if: ${{ needs.authz.result == 'success' }}
        run: python3 scripts/ci_verify.py sanitizers --build-dir build-asan --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache --ctest-shard ${{ matrix.shard }}/4

      - name: Stage and summarize diagnostics
        if: ${{ always() && needs.authz.result == 'success' }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-asan --profile sanitizers

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-sanitizers-shard-${{ matrix.shard }}-of-4
          path: ci-diagnostics/
          if-no-files-found: warn

  sanitizers-gate:
    name: sanitizers
    needs: [authz, sanitizers]
    if: ${{ !cancelled() && needs.authz.result == 'success' }}
    runs-on: gke-2cpu-4gb-amd64
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every shard to have passed
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.sanitizers.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "shards: $SHARD_RESULT"
          [[ "$SHARD_RESULT" == "success" ]]

  # Kernel-only lane: PINEFORGE_BUILD_SOURCE_LAYER=OFF. Proves the engine
  # still configures, builds, installs and passes its source-free CTest set
  # with no Pine adapter compiled, and that libpineforge_kernel.a carries no
  # source-layer symbol. The live runner stays ON so its two native example
  # modules are built from the kernel alone, and every examples/native host
  # runs as an example_* row asserting both its exit code and its summary line.
  kernel-only:
    name: kernel-only-shard (${{ matrix.shard }}/2)
    needs: [authz]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      PINEFORGE_REQUIRE_RELEASE_TAGS: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: gke-16cpu-32gb-amd64
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # pytest for the CTest rows that run `python -m pytest` (tests/CMakeLists.txt:
      # test_run_json_selected_window, test_compile_inventory_pipeline), the same
      # hash-pinned wheels as the preflight job. A failed install fails the job.
      - name: Install the CTest pytest runner
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary ':all:' -r scripts/requirements-preflight.txt

      - name: Install dependencies
        if: ${{ needs.authz.result == 'success' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev zlib1g-dev ccache

      - name: Set up pinned WebSocket-enabled libcurl
        id: curl-deps
        if: ${{ needs.authz.result == 'success' }}
        uses: ./.github/actions/setup-live-curl

      - name: Verify (kernel)
        if: ${{ needs.authz.result == 'success' }}
        run: python3 scripts/ci_verify.py kernel --build-dir build-kernel --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache --curl-dir "${{ steps.curl-deps.outputs.curl-dir }}" --ctest-shard ${{ matrix.shard }}/2

      - name: Stage and summarize diagnostics
        if: ${{ always() && needs.authz.result == 'success' }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-kernel --profile kernel --dependency-dir build-native-deps

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics-kernel-shard-${{ matrix.shard }}-of-2
          path: ci-diagnostics/
          if-no-files-found: warn

  kernel-only-gate:
    name: kernel-only
    needs: [authz, kernel-only]
    if: ${{ !cancelled() && needs.authz.result == 'success' }}
    runs-on: gke-2cpu-4gb-amd64
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every shard to have passed
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.kernel-only.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "shards: $SHARD_RESULT"
          [[ "$SHARD_RESULT" == "success" ]]

  # Reuse all three native profiles on main, nightly and manual CI runs.
  native-live:
    needs: [authz]
    uses: ./.github/workflows/native-live.yml
    with:
      exclude_slow: false
      cold_cache: ${{ inputs.cold_native_cache || false }}

  # Keep the advisory subset on full events as well as in the separate PR file.
  # The maintainers post the required pineforge/parity status from their
  # separate parity verdict.
  corpus-parity-subset:
    needs: [authz]
    uses: ./.github/workflows/corpus-parity.yml
    with:
      mode: subset

  corpus-parity:
    needs: [authz]
    uses: ./.github/workflows/corpus-parity.yml
    with:
      mode: full

  # The required aggregate covers every job directly; every result must succeed.
  build-gate:
    needs: [authz, preflight, build, build-debug, build-release-gate, build-debug-gate, build-arm, sanitizers, sanitizers-gate, native-live, kernel-only, kernel-only-gate, corpus-parity-subset, preflight-slow, corpus-parity]
    if: always()
    # The aggregate runs only the refusal and result checks on the light pool.
    runs-on: gke-2cpu-4gb-amd64
    permissions:
      contents: read
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every verification lane to have passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [ "$(echo "$RESULTS" | tr -d '[] \n"' | tr ',' '\n' | grep -vc '^success$')" = "0" ] || { echo "::error::a needed job did not succeed"; exit 1; }
