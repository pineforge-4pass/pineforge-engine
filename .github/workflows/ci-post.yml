name: CI post-merge

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Each proof run is unique; newer pushes never cancel queued or running proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # The run-failure source guards read the newest release tag. Every job that
  # runs them fetches it (fetch-depth: 0), so here a missing tag fails them
  # instead of taking their tag-less offline path (rebuilding the published
  # catalog from the checked-in diff), which only a clone without tags needs.
  PINEFORGE_REQUIRE_RELEASE_TAGS: "1"

# The canon authz gate admits our events before any checkout.
# Light jobs, the aggregate and proof jobs use the standard hosted Ubuntu images.
# Each verification sizes its parallelism to the runner that took it.
# scripts/ci_preflight.py pins every runner and every smoke step. GitHub's platform
# maximum remains the only job time limit; docs/ci.md records the policy.
jobs:
  authz:
    name: authz
    runs-on: ubuntu-24.04
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # bind identity to the triggering run and its re-runner.
              # These two App bots are fixed canon policy; ALLOWED_BOTS is PR-only.
              [ -n "${WR_HEAD_REPO:-}" ] || fail "workflow_run head repository is missing"
              [ -n "${WR_ACTOR:-}" ] || fail "workflow_run triggering actor is missing"
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run head repository does not match this repository"
              case "$WR_ACTOR" in
                "pineforge-app[bot]"|"pineforge-ci-dispatcher[bot]") ;;
                *"[bot]") fail "workflow_run bot is not on the canon allowlist" ;;
                *)
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null) || fail "workflow_run permission lookup failed"
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor does not have write permission" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  # Whether the change is documentation only; scripts/ci_docs_only.py holds the
  # rule, and every doubt answers no. On a docs-only push the
  # proof jobs below skip and the build aggregate accepts exactly that skip.
  # Preflight consumes its independent verifier-class answer, and docs.yml
  # builds the site as before. Classification uses the light pool class.
  changes:
    needs: [authz]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PF_CI_LABELS: '[]'
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      verifier_slow: ${{ steps.verifier.outputs.verifier_slow }}
    steps:
      # The tested commit and its parents: a pull request's merge and the base
      # it merged into, a push's commit and its parent.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      # The base's own copy of the rule judges the change, so a change to the
      # rule is never judged by itself; a base without one runs every job.
      - name: Classify the change
        id: classify
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          if git show HEAD^1:scripts/ci_docs_only.py > "$RUNNER_TEMP/ci_docs_only.py"; then
            python3 "$RUNNER_TEMP/ci_docs_only.py" --root . --github-output "$GITHUB_OUTPUT"
          else
            echo "not docs-only: the base holds no scripts/ci_docs_only.py"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # This helper uses the base ci_docs_only.py staged above to read the
      # same tested diff. A base without the new rule runs every class.
      - name: Classify verifier self-tests
        id: verifier
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git show HEAD^1:scripts/ci_verifier_paths.py > "$RUNNER_TEMP/ci_verifier_paths.py"; then
            python3 "$RUNNER_TEMP/ci_verifier_paths.py" --root . --github-output "$GITHUB_OUTPUT"
          else
            echo "verifier SLOW: the base holds no scripts/ci_verifier_paths.py"
            echo "verifier_slow=true" >> "$GITHUB_OUTPUT"
          fi

  build-x86-gcc133:
    needs: [authz]
    if: ${{ always() && needs.authz.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Checkout the exact workflow head
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build native x86 GNU 13.3.0 Release
        if: ${{ needs.authz.result == 'success' }}
        run: |
          python3 scripts/ci_native_x86_release.py --source . --build-dir build-x86-gcc133 --artifact-dir ci-native-x86-gcc133 --jobs "$(getconf _NPROCESSORS_ONLN)"
      - name: Retain native x86 GNU 13.3.0 build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-post-native-x86-gcc133
          path: ci-native-x86-gcc133/
          if-no-files-found: warn

  preflight:
    needs: [authz, changes]
    if: ${{ always() && needs.authz.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      PF_CI_LABELS: '[]'
      PINEFORGE_VERIFIER_SLOW: ${{ needs.changes.result == 'success' && needs.changes.outputs.verifier_slow || 'true' }}
    # PRs run only source, documentation and policy checks. Build-driving
    # controls and dependency-heavy harness tests are the slow tier, which the
    # lab's preflight step runs (tier all) on the exact head tree before every merge.
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install workflow linters
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          tools_dir="$RUNNER_TEMP/pineforge-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify workflow wiring and source guards
        if: ${{ needs.authz.result == 'success' }}
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight --tier fast

      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-preflight
          path: build-ci-preflight/
          if-no-files-found: warn

  # Every CI round fits fifteen minutes of wall time. Each configuration builds
  # the PR smoke target and runs the fast CTest label; the full profiles run in
  # the lab's verify on the exact head tree before every merge (docs/ci.md,
  # "Where the full suites run").
  smoke:
    name: build (ubuntu-24.04, ${{ matrix.build_type }})
    needs: [authz, changes]
    if: ${{ always() && needs.authz.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require the amd64 machine
        if: ${{ needs.authz.result == 'success' }}
        run: |
          test "$(uname -m)" = x86_64
      - name: Checkout the exact workflow head
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: ${{ needs.authz.result == 'success' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache
      - name: Verify ${{ matrix.build_type }} smoke
        if: ${{ needs.authz.result == 'success' }}
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPINEFORGE_VERSION_SOURCE=FILE \
            -DPython3_EXECUTABLE="$(command -v python3)" -DPINEFORGE_BUILD_TESTS=ON \
            -DPINEFORGE_BUILD_SOURCE_LAYER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_BUILD_LIVE_RUNNER=OFF -DPINEFORGE_BUILD_CORPUS_STRATEGIES=OFF \
            -DPINEFORGE_BUILD_EXAMPLES=OFF -DPINEFORGE_REQUIRE_ABI_RECEIPTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target pineforge_pr_smoke --parallel "$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build -L '^fast$' --output-on-failure --no-tests=error \
            --parallel "$(getconf _NPROCESSORS_ONLN)" --output-junit build/ctest-junit.xml

  # The same smoke on the arm64 hosted image.
  smoke-arm:
    name: build (ubuntu-24.04-arm, ${{ matrix.build_type }})
    needs: [authz, changes]
    if: ${{ always() && needs.authz.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require the arm64 machine
        if: ${{ needs.authz.result == 'success' }}
        run: |
          test "$(uname -m)" = aarch64
      - name: Checkout the exact workflow head
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: ${{ needs.authz.result == 'success' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache
      - name: Verify ${{ matrix.build_type }} smoke
        if: ${{ needs.authz.result == 'success' }}
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPINEFORGE_VERSION_SOURCE=FILE \
            -DPython3_EXECUTABLE="$(command -v python3)" -DPINEFORGE_BUILD_TESTS=ON \
            -DPINEFORGE_BUILD_SOURCE_LAYER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_BUILD_LIVE_RUNNER=OFF -DPINEFORGE_BUILD_CORPUS_STRATEGIES=OFF \
            -DPINEFORGE_BUILD_EXAMPLES=OFF -DPINEFORGE_REQUIRE_ABI_RECEIPTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target pineforge_pr_smoke --parallel "$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build -L '^fast$' --output-on-failure --no-tests=error \
            --parallel "$(getconf _NPROCESSORS_ONLN)" --output-junit build/ctest-junit.xml

  # The same smoke under ASan and UBSan, with the full sanitizers profile's
  # build flags and run options (scripts/ci_verify.py).
  sanitizers:
    needs: [authz, changes]
    if: ${{ always() && needs.authz.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Checkout the exact workflow head
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: ${{ needs.authz.result == 'success' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: ${{ needs.authz.result == 'success' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache
      - name: Verify the sanitizer smoke
        if: ${{ needs.authz.result == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DPINEFORGE_ENABLE_SANITIZERS=ON -DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPINEFORGE_VERSION_SOURCE=FILE \
            -DPython3_EXECUTABLE="$(command -v python3)" -DPINEFORGE_BUILD_TESTS=ON \
            -DPINEFORGE_BUILD_SOURCE_LAYER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_BUILD_LIVE_RUNNER=OFF -DPINEFORGE_BUILD_CORPUS_STRATEGIES=OFF \
            -DPINEFORGE_BUILD_EXAMPLES=OFF -DPINEFORGE_REQUIRE_ABI_RECEIPTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build-asan --target pineforge_pr_smoke --parallel "$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build-asan -L '^fast$' --output-on-failure --no-tests=error \
            --parallel "$(getconf _NPROCESSORS_ONLN)" --output-junit build-asan/ctest-junit.xml

  # Keep the advisory subset on full events as well as in the separate PR file.
  # The maintainers post the required pineforge/parity status from their
  # separate parity verdict.
  corpus-parity-subset:
    needs: [authz, changes]
    if: ${{ always() && needs.authz.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    uses: ./.github/workflows/corpus-parity.yml
    with:
      mode: subset

  # Advisory aggregate context covering every GitHub Actions lane. The merge
  # ruleset requires pineforge/verify and pineforge/parity, posted by the
  # maintainers, rather than this build context.
  build-gate:
    name: build
    needs: [authz, changes, preflight, build-x86-gcc133, smoke, smoke-arm, sanitizers, corpus-parity-subset]
    if: always()
    # The aggregate runs inline Python and shell on the light pool class.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PF_CI_LABELS: '[]'
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require every verification lane to have passed
        shell: bash
        env:
          AUTHZ_RESULT: ${{ needs.authz.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          X86_GCC133_RESULT: ${{ needs.build-x86-gcc133.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ARM_SMOKE_RESULT: ${{ needs.smoke-arm.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
          PARITY_RESULT: ${{ needs.corpus-parity-subset.result }}
        run: |
          printf '%s\n' "authz: $AUTHZ_RESULT" "changes: $CHANGES_RESULT, docs only: ${DOCS_ONLY:-unanswered}" \
            "preflight: $PREFLIGHT_RESULT" "native x86 GNU 13.3.0: $X86_GCC133_RESULT" \
            "amd64 smoke: $SMOKE_RESULT" "arm64 smoke: $ARM_SMOKE_RESULT" \
            "sanitizers: $SANITIZER_RESULT" "corpus parity (subset): $PARITY_RESULT"
          # Every smoke leg and the subset parity must pass. Only a classified
          # docs-only push may skip them; preflight passes even for a docs-only push.
          docs_only=false
          if [[ "$CHANGES_RESULT" == "success" && "$DOCS_ONLY" == "true" ]]; then docs_only=true; fi
          passed() { [[ "$1" == "success" || ( "$docs_only" == "true" && "$1" == "skipped" ) ]]; }
          [[ "$AUTHZ_RESULT" == "success" && "$CHANGES_RESULT" == "success" ]] \
            && [[ "$PREFLIGHT_RESULT" == "success" ]] \
            && [[ "$X86_GCC133_RESULT" == "success" ]] \
            && passed "$SMOKE_RESULT" && passed "$ARM_SMOKE_RESULT" \
            && passed "$SANITIZER_RESULT" && passed "$PARITY_RESULT"
