# PineForge parity campaign — post-merge baseline promotion.
#
# Install into BOTH product repos, unchanged (the repo axis is auto-detected):
#   pineforge-engine/.github/workflows/promote-baseline.yml
#   pineforge-codegen-oss/.github/workflows/promote-baseline.yml
#
# On a merged PR it advances the campaign baseline one axis, reusing the
# snapshot the gate already measured. It promotes ONLY when the merge commit
# now on the base branch carries the gated PR head's TREE (a squash merge mints
# a new commit; the strict up-to-date rule keeps its tree the head's), the gate
# is green on that head, and `lab promote` finds the verdict that binds it:
#   engine   pineforge/verify and pineforge/parity success on the PR head;
#            lab promote adopts the pair the merge gate's parity verdict
#            measured — the merged engine with the codegen the sweep measured
#            (ruling R2, 2026-09-26), PASS or neutral alike
#   codegen  no failing check-run on the PR head; lab promote needs a pr-gate
#            PASS binding (baseline engine, merged codegen), exact head
# Otherwise it exits green without promoting.
#
# It runs on a push to main, using MAIN's own copy at refs/heads/main. The
# pf-gcp-main class admits this allowlisted workflow at that ref. The
# promotion identity's WIF condition pins job_workflow_ref to
# `<repo>/.github/workflows/promote-baseline.yml@refs/heads/main` and the run
# ref to refs/heads/main, with no event restriction
# (terraform/gcp/github-wif.tf:133-134), so a push to main satisfies both gates.
# The pushed SHA must resolve to exactly one merged PR with that merge commit
# and base main; no match or ambiguity skips promotion. It checks out and runs
# no PR code: it fetches the PR head's objects only to compare trees.
#
# The plane is GCP: the
# promotion reads the active baseline and the gate ledger from the Postgres
# registry through a cloud-sql-proxy, streams the pinned documents from the
# GCS evidence bucket, and appends the new baseline row — authenticated by
# workload identity federation, so no long-lived GCP key lives in the repo.
#
# Required in each product repo:
#   secrets PINEFORGE_APP_ID + PINEFORGE_APP_PRIVATE_KEY  the org App (already
#          present for release.yml) — the job mints a short-lived, read-only
#          token from it to check out the private pineforge-workflow repo, so
#          NO personal access token is needed
#   var    WORKFLOW_REPO         optional override, defaults to pineforge-4pass/pineforge-workflow
#   var    GCP_WORKLOAD_IDENTITY_PROVIDER
#          the full provider resource name — terraform/gcp output
#          `github_workload_identity_provider`
#   var    GCP_SERVICE_ACCOUNT
#          the dedicated promotion service account this workflow impersonates
#          through that provider — terraform/gcp output
#          `github_promotion_service_account`. Terraform binds the repo-pinned
#          federated identity to it (roles/iam.workloadIdentityUser) and
#          grants it exactly what the steps below use, and nothing else:
#          Cloud SQL Client on the registry instance (the proxy this job
#          starts), accessor on secret pineforge-registry-db (the DSN
#          password baseline-promote resolves), and objectViewer on the
#          evidence bucket (the three pinned documents it streams). No
#          Cloud Run role: this workflow executes no job. Nothing is left for
#          an operator to grant by hand.
#
# This file's PATH and REF are part of the identity: the WIF provider admits
# only `<owner>/<repo>/.github/workflows/promote-baseline.yml@refs/heads/main`,
# so installing it under another name, or running another branch's copy,
# mints no token — and no other workflow in the repo can mint one either.
#
# (Optionally pin WORKFLOW_REF, defaults to main; and PINEFORGE_EVIDENCE_BUCKET,
#  defaults to pineforge-workflow-evidence.)

name: promote-baseline

on:
  push:
    branches: [main]
  # Manual re-fire, from main, for a merge whose event already passed (e.g. a
  # PR merged before this workflow was installed): the commit now on the base
  # branch, the PR head the gate cleared, and the PR.
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "40-hex commit now on the base branch to promote"
        required: true
      head_sha:
        description: "40-hex PR head the gate cleared (the merge commit must carry its tree)"
        required: true
      pr_number:
        description: "the PR number"
        required: true
      pr_url:
        description: "the PR url (recorded in the merge receipt)"
        required: true
      merged_at:
        description: "ISO-8601 merge time"
        required: true

concurrency:
  group: promote-baseline
  cancel-in-progress: false

permissions:
  contents: read
  # commits/{sha}/pulls needs pull-request read access for the repo-scoped
  # token, including when this unchanged workflow is installed in a private repo.
  pull-requests: read
  # The engine's gate is two commit statuses (pineforge/verify,
  # pineforge/parity): `statuses`. The codegen axis reads check-runs: `checks`.
  statuses: read
  checks: read
  # Workload identity federation mints the GCP credential from the job's own
  # OIDC token; nothing here can promote without this repo's identity.
  id-token: write

jobs:
  promote-guard:
    name: promote-guard
    runs-on: ubuntu-latest
    # Resolution needs read access in private repos; no secrets or OIDC here.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.authorize.outputs.ok }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      merged_at: ${{ steps.pr.outputs.merged_at }}
    steps:
      - name: Resolve the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_MERGE_SHA: ${{ github.event.inputs.merge_commit }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_PR_URL: ${{ github.event.inputs.pr_url }}
          INPUT_MERGED_AT: ${{ github.event.inputs.merged_at }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$REF" = refs/heads/main ] || fail "baseline promotion requires refs/heads/main"
          case "$EVENT_NAME" in
            workflow_dispatch)
              for value in "$INPUT_MERGE_SHA" "$INPUT_HEAD_SHA" "$INPUT_PR_NUMBER" "$INPUT_PR_URL" "$INPUT_MERGED_AT"; do
                [[ -n "${value//[[:space:]]/}" && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || fail "empty or unreadable dispatch input"
              done
              printf '%s\n' "merge_sha=$INPUT_MERGE_SHA" "head_sha=$INPUT_HEAD_SHA" \
                "pr_number=$INPUT_PR_NUMBER" "pr_url=$INPUT_PR_URL" \
                "merged_at=$INPUT_MERGED_AT" "ok=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push) ;;
            *) fail "event $EVENT_NAME does not run baseline promotion (only push and workflow_dispatch are allowed)" ;;
          esac
          # Search every page: a second match must defer, never pick a PR.
          pulls=$(gh api --paginate --slurp \
            "repos/$REPO/commits/$SHA/pulls?per_page=100")
          python3 - 3<<<"$pulls" <<'PY'
          import json
          import os
          import re
          import subprocess

          def skip(reason):
              print(f"::notice::{reason}; skipping")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("ok=false\n")

          def fail(reason):
              print(f"::error title=authz::{reason}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"authz: REFUSED: {reason}\n")
              raise SystemExit(1)

          def reject_constant(value):
              raise ValueError(f"invalid JSON constant: {value}")

          def field(obj, *keys):
              for key in keys:
                  obj = obj.get(key) if isinstance(obj, dict) else None
              if (not isinstance(obj, str) or not obj.strip()
                      or any(ord(char) < 32 for char in obj)):
                  fail("empty or unreadable PR field: " + ".".join(keys))
              return obj

          sha = os.environ["SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              fail("empty or unreadable pushed SHA")
          try:
              pages = json.loads(open(3, encoding="utf-8").read(), parse_constant=reject_constant)
          except (ValueError, RecursionError):
              skip("invalid merged PR response JSON")
              raise SystemExit(0)
          if (not isinstance(pages, list)
                  or any(not isinstance(page, list) for page in pages)
                  or any(not isinstance(pr, dict) for page in pages for pr in page)):
              skip("invalid merged PR response page array")
              raise SystemExit(0)
          matches = [pr for page in pages for pr in page
                     if pr.get("state") == "closed"
                     and pr.get("merged_at") is not None
                     and pr.get("merge_commit_sha") == sha
                     and isinstance(pr.get("base"), dict)
                     and pr["base"].get("ref") == "main"]
          if len(matches) != 1:
              skip(f"found {len(matches)} merged PRs with merge commit {sha} and base main")
              raise SystemExit(0)
          selected = matches[0]
          number = selected.get("number")
          if type(number) is not int or number <= 0:
              fail("empty or unreadable PR number")
          # The association endpoint returns a summary PR without merged_by.
          # Read that selected PR's full API response, binding it to the same
          # merge, base and head before using any identity or merge metadata.
          try:
              response = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['REPO']}/pulls/{number}"],
                  check=True, capture_output=True, text=True)
              pr = json.loads(response.stdout, parse_constant=reject_constant)
          except (subprocess.CalledProcessError, OSError, ValueError, RecursionError):
              fail("unreadable resolved PR response")
          if (not isinstance(pr, dict) or type(pr.get("number")) is not int
                  or pr.get("number") != number
                  or pr.get("state") != "closed" or pr.get("merged") is not True
                  or pr.get("merge_commit_sha") != sha
                  or field(pr, "base", "ref") != "main"
                  or field(pr, "head", "sha") != field(selected, "head", "sha")
                  or field(pr, "merged_at") != field(selected, "merged_at")):
              fail("resolved PR no longer matches the pushed merge")
          head_sha = field(pr, "head", "sha")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              fail("empty or unreadable PR head SHA")
          head = pr.get("head")
          repo = head.get("repo") if isinstance(head, dict) else None
          fork = repo.get("fork") if isinstance(repo, dict) else None
          if type(fork) is not bool:
              fail("empty or unreadable PR field: head.repo.fork")
          values = {
              "merge_sha": sha,
              "head_sha": head_sha,
              "pr_number": number,
              "pr_url": field(pr, "html_url"),
              "merged_at": field(pr, "merged_at"),
              "head_repo": field(pr, "head", "repo", "full_name"),
              "head_is_fork": str(fork).lower(),
              "association": field(pr, "author_association"),
              "pr_author": field(pr, "user", "login"),
              "merged_by": field(pr, "merged_by", "login"),
              "ok": "true",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Only our own merged pull requests and dispatches promote the baseline
        id: authorize
        if: steps.pr.outputs.ok == 'true'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_IS_FORK: ${{ steps.pr.outputs.head_is_fork }}
          ASSOCIATION: ${{ steps.pr.outputs.association }}
          PR_AUTHOR: ${{ steps.pr.outputs.pr_author }}
          MERGED_BY: ${{ steps.pr.outputs.merged_by }}
          GH_TOKEN: ${{ github.token }}   # read-only use: permission lookups for the PR author and merger
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -euo pipefail
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            workflow_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            push)
              [ -n "$REPO" ] || fail "repository is empty"
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              [ -n "$ASSOCIATION" ] || fail "pull request author association is empty"
              [ -n "$PR_AUTHOR" ] || fail "pull request author is empty"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac
              [ -n "$MERGED_BY" ] || fail "push merger is empty"
              case " $ALLOWED_BOTS " in
                *" $MERGED_BY "*) ;;
                *)
                  # No author_association exists for the merger: ask GitHub for the merger's permission on
                  # this repository; anything but admin/maintain/write (or a failed call) refuses.
                  perm=$(gh api "repos/$REPO/collaborators/$MERGED_BY/permission" --jq .permission 2>/dev/null || echo none)
                  case "$perm" in admin|maintain|write) ;; *) fail "push merger ${MERGED_BY:-unknown} has permission '$perm', not write" ;; esac ;;
              esac ;;
            *) fail "event $EVENT does not run baseline promotion (only push and workflow_dispatch are allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"
          echo "ok=true" >> "$GITHUB_OUTPUT"

  promote:
    needs: [promote-guard]
    if: ${{ needs.promote-guard.result == 'success' && needs.promote-guard.outputs.ok == 'true' }}
    runs-on: ["self-hosted","pf-gcp-main"]
    steps:
      - name: Determine repo axis
        id: axis
        run: |
          case "${{ github.repository }}" in
            *codegen*) echo "repo=codegen" >> "$GITHUB_OUTPUT" ;;
            *)         echo "repo=engine"  >> "$GITHUB_OUTPUT" ;;
          esac

      # The pushed main commit (or the dispatch ref), never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The safety property is the TREE: the snapshot describes the gated
      # head's tree, so we promote only when the merge commit now on the base
      # branch carries exactly that tree. A base that moved before the merge,
      # or a rewrite, is skipped — those must be re-gated.
      - name: Verify the merged tree is the gated tree
        id: exacttree
        env:
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          PR_NUMBER: ${{ needs.promote-guard.outputs.pr_number }}
          BASE_REF: main
        run: |
          set -euo pipefail
          # The PR head's objects, to read its tree: fetched, never checked out or run.
          git fetch --quiet origin "$BASE_REF" "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          if ! git merge-base --is-ancestor "$MERGE_SHA" "origin/$BASE_REF"; then
            echo "::notice::merge commit $MERGE_SHA is not on origin/$BASE_REF; skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merge_tree=$(git rev-parse "$MERGE_SHA^{tree}")
          head_tree=$(git rev-parse "$HEAD_SHA^{tree}")
          if [ "$merge_tree" != "$head_tree" ]; then
            echo "::notice::merge commit tree $merge_tree != gated head tree $head_tree — the base moved before the merge; re-gate. skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "merge_tree=$merge_tree" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Confirm the gate on the PR head
        id: ci
        if: steps.exacttree.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          AXIS: ${{ steps.axis.outputs.repo }}
        run: |
          set -euo pipefail
          if [ "$AXIS" = engine ]; then
            # The engine merge gate. GitHub lists newest statuses first; keep
            # the first occurrence of each context across pages, so an older
            # success cannot mask a newer failure or pending verdict.
            statuses=$(gh api --paginate \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/statuses?per_page=100")
            if ! jq -es '
              reduce (.[][]) as $s ({};
                if has($s.context) then . else .[$s.context] = $s.state end)
              | .["pineforge/verify"] == "success"
                and .["pineforge/parity"] == "success"
            ' <<< "$statuses" >/dev/null; then
              echo "::notice::pineforge/verify and pineforge/parity must both be success on $HEAD_SHA — skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            bad=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
              --jq '[.check_runs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="action_required")] | length')
            if [ "$bad" != "0" ]; then
              echo "::notice::$bad failing check-run(s) on $HEAD_SHA — not green; skipping"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"

      # The campaign tooling lives in the private pineforge-workflow repo. Rather
      # than a long-lived PAT, mint a short-lived, read-only token from the org
      # App already installed here (the same app-id/private-key release.yml
      # uses), scoped to just that one repo and to reading its contents: without
      # a permission-* input the token would carry every permission the App's
      # installation has, and only the checkout below uses it.
      - name: Mint an org App token to read the campaign tooling
        id: app
        if: steps.ci.outputs.green == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-workflow
          permission-contents: read

      - name: Checkout campaign tooling (pineforge-workflow)
        if: steps.ci.outputs.green == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.WORKFLOW_REPO || 'pineforge-4pass/pineforge-workflow' }}
          ref: ${{ vars.WORKFLOW_REF || 'main' }}
          token: ${{ steps.app.outputs.token }}
          path: .workflow

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ci.outputs.green == 'true'
        with:
          node-version: '22'

      - name: Authenticate to GCP
        if: steps.ci.outputs.green == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.ci.outputs.green == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The plane is Postgres on Cloud SQL; the promotion reads the active
      # baseline and the gate ledger there, so this runner needs the same
      # connector-path proxy operators use.
      - name: Start cloud-sql-proxy
        if: steps.ci.outputs.green == 'true'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --port 5433 \
            gen-lang-client-0864094636:asia-east1:pineforge-workflow-pg &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5433) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "cloud-sql-proxy did not become ready" >&2
          exit 1

      - name: Install campaign dependencies
        if: steps.ci.outputs.green == 'true'
        run: npm ci --prefix .workflow/campaign

      - name: Promote baseline
        if: steps.ci.outputs.green == 'true'
        env:
          PINEFORGE_PLANE: gcp
          PINEFORGE_REGISTRY_HOST: 127.0.0.1:5433
          PINEFORGE_EVIDENCE_BUCKET: ${{ vars.PINEFORGE_EVIDENCE_BUCKET || 'pineforge-workflow-evidence' }}
          # No metadata server on a GitHub runner; mint GCS tokens from the
          # federated gcloud credential explicitly.
          PINEFORGE_GCP_TOKEN_CMD: gcloud auth print-access-token
          MERGE_SHA: ${{ needs.promote-guard.outputs.merge_sha }}
          HEAD_SHA: ${{ needs.promote-guard.outputs.head_sha }}
          MERGE_TREE: ${{ steps.exacttree.outputs.merge_tree }}
          PR_NUMBER: ${{ needs.promote-guard.outputs.pr_number }}
          PR_URL: ${{ needs.promote-guard.outputs.pr_url }}
          MERGED_AT: ${{ needs.promote-guard.outputs.merged_at }}
        run: |
          set -euo pipefail
          ms=$(node -e "process.stdout.write(String(Date.parse(process.env.MERGED_AT)))")
          set +e
          node .workflow/campaign/src/baseline-promote.mjs \
            --repo "${{ steps.axis.outputs.repo }}" \
            --merge-commit "$MERGE_SHA" --head-sha "$HEAD_SHA" --merge-tree "$MERGE_TREE" \
            --ci-head "$HEAD_SHA" --ci-green \
            --pr-number "$PR_NUMBER" --pr-url "$PR_URL" --merged-at-ms "$ms"
          code=$?
          set -e
          # Exit 2 is `refuse`: no verdict binds this merge as a single-axis
          # advance -- a cross-cutting engine+codegen change (gated as a composite
          # the single axis cannot complete), an ungated merge, a squash-merged
          # codegen PR (exact head only there), or an engine merge the diff rule
          # cleared (nothing measured). Defer green, do not fail CI; a cross-cutting pair is promoted by
          # hand with `lab promote --composite` once both repos merge (see the
          # baseline-promote skill). Any other non-zero is a real error.
          if [ "$code" = "2" ]; then
            echo "::notice::baseline not promoted (deferred): no verdict binds this merge as a single-axis advance (see the lab promote refusal above). If this was a cross-cutting engine+codegen change, run the composite promote by hand once both repos are merged. Nothing was changed."
            exit 0
          fi
          exit "$code"
