# One-off workflow template: install verbatim on the engine main branch at
# .github/workflows/fleet-post-capability.yml. Do not dispatch it from this repo.
name: fleet-post-capability
run-name: post-capability:${{ inputs.vm }}
on:
  workflow_dispatch:
    inputs:
      vm:
        description: New VM, still in the holding group with its VM label only
        required: true
        type: choice
        options:
          - pf-gcp-post-4
          - pf-gcp-post-5
          - pf-gcp-post-6
permissions: {}
concurrency:
  group: post-capability-${{ inputs.vm }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  capability:
    name: post-capability-${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    runs-on: ["self-hosted","pf-gcp-post"]
    env:
      TARGET_VM: ${{ inputs.vm }}
      SLOT: ${{ matrix.slot }}
    steps:
      - name: Verify both runner identities and VM capabilities
        run: |
          set +x
          set -euo pipefail
          umask 077
          fail() { printf '::error::%s\n' "$*" >&2; exit 1; }
          case "$TARGET_VM" in pf-gcp-post-4|pf-gcp-post-5|pf-gcp-post-6) ;; *) fail 'VM outside the plan' ;; esac
          [[ "$(hostname -s)" = "$TARGET_VM" ]] || fail 'Wrong VM'
          [[ "$EUID" != 0 && "$(id -un)" = runner ]] || fail 'Capabilities must run as the normal runner user'
          [[ "$GITHUB_EVENT_NAME" = workflow_dispatch && "$GITHUB_REF" = refs/heads/main ]] || fail 'Wrong event or branch'
          [[ "$RUNNER_NAME" = "$TARGET_VM-r1" || "$RUNNER_NAME" = "$TARGET_VM-r2" ]] || fail 'Wrong runner'
          case "$SLOT" in a) peer=b ;; b) peer=a ;; *) fail 'Wrong matrix slot' ;; esac
          shared=/var/tmp/pf-post-canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          install -d -m 0700 "$shared"
          # Neither job can finish before the other starts, so one runner cannot
          # execute both jobs sequentially and masquerade as coverage of two runners.
          printf '%s\n' "$RUNNER_NAME" > "$shared/$SLOT.runner"
          ready=0
          for ((poll=0; poll<120; poll++)); do
            if [[ -s "$shared/$peer.runner" ]]; then ready=1; break; fi
            sleep 5
          done
          [[ "$ready" = 1 ]] || fail 'Second local runner did not start in ten minutes'
          peer_runner=$(cat "$shared/$peer.runner")
          [[ "$peer_runner" != "$RUNNER_NAME" &&
             ( "$peer_runner" = "$TARGET_VM-r1" || "$peer_runner" = "$TARGET_VM-r2" ) ]] || fail 'Both jobs used the same runner or a wrong runner'
          sudo -n true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache
          docker info --format '{{.OSType}}' | grep -Fx linux
          # Only VM prerequisites: this does not build or run the engine suite.
          python3 - <<'PY'
          import ctypes
          import fcntl
          import mmap
          import os
          import struct
          import subprocess
          import tempfile

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          roots = ("/dev/shm", "/tmp", "/var/tmp")
          magic = {
              root: int(subprocess.check_output(
                  ["stat", "-f", "-c", "%t", root], text=True).strip(), 16)
              for root in roots
          }
          def require_tmpfs(root):
              require(magic[root] == 0x01021994, "required tmpfs is absent")
          def require_disk(root):
              require(magic[root] not in (0x01021994, 0x858458F6),
                      "required disk fallback is memory-backed")

          # RED controls use the real filesystems. Neither a no-op assertion nor
          # a constant success can reject both deliberately wrong classifications.
          rejected = 0
          try:
              require_tmpfs("/var/tmp")
          except RuntimeError:
              rejected += 1
          try:
              require_disk("/dev/shm")
          except RuntimeError:
              rejected += 1
          require(rejected == 2, "filesystem negative controls did not both reject")
          require_tmpfs("/dev/shm")
          require_disk("/var/tmp")
          require(os.path.isdir("/proc/self/fd"), "descriptor inspection is unavailable")
          before = len(os.listdir("/proc/self/fd"))

          libc = ctypes.CDLL(None, use_errno=True)
          libc.inotify_init1.argtypes = [ctypes.c_int]
          libc.inotify_init1.restype = ctypes.c_int
          libc.inotify_add_watch.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_uint32]
          libc.inotify_add_watch.restype = ctypes.c_int
          notify = libc.inotify_init1(os.O_NONBLOCK | os.O_CLOEXEC)
          require(notify >= 0, "inotify_init1 failed")
          observed = set()
          expected = {}
          try:
              for root in roots:
                  wd = libc.inotify_add_watch(notify, os.fsencode(root), 0x100 | 0x80)
                  require(wd >= 0, "cannot watch a scratch candidate")
                  fd, path = tempfile.mkstemp(prefix="pf-post-canary-", dir=root)
                  expected[(wd, os.path.basename(path))] = root
                  try:
                      payload = b"scratch-capability:" + bytes(range(256)) * 16
                      require(os.write(fd, payload) == len(payload), "short scratch write")
                      os.fsync(fd)
                      os.lseek(fd, 0, os.SEEK_SET)
                      require(os.read(fd, len(payload)) == payload, "scratch bytes changed")
                  finally:
                      os.close(fd)
                      os.unlink(path)
              while True:
                  try:
                      events = os.read(notify, 65536)
                  except BlockingIOError:
                      break
                  require(events, "unexpected empty inotify read")
                  offset = 0
                  while offset < len(events):
                      wd, mask, cookie, length = struct.unpack_from("iIII", events, offset)
                      require(not mask & (0x4000 | 0x8000), "inotify overflow or lost watch")
                      name = os.fsdecode(events[offset + 16:offset + 16 + length].split(b"\0", 1)[0])
                      if (wd, name) in expected and mask & (0x100 | 0x80):
                          observed.add(expected[(wd, name)])
                      offset += 16 + length
              require(observed == set(roots), "creation watches did not witness all candidates")
          finally:
              os.close(notify)

          # Matches the jailed fixture's 32 MiB memfd and grow/shrink/seal seals.
          arena = os.memfd_create("pf-post-canary-arena", os.MFD_CLOEXEC | os.MFD_ALLOW_SEALING)
          try:
              os.ftruncate(arena, 32 * 1024 * 1024)
              seals = fcntl.F_SEAL_GROW | fcntl.F_SEAL_SHRINK | fcntl.F_SEAL_SEAL
              fcntl.fcntl(arena, fcntl.F_ADD_SEALS, seals)
              require(fcntl.fcntl(arena, fcntl.F_GET_SEALS) & seals == seals,
                      "memfd seals are missing")
              with mmap.mmap(arena, 1024 * 1024) as window:
                  window[:16] = b"memfd-capability"
                  window.flush()
                  require(os.pread(arena, 16, 0) == b"memfd-capability",
                          "sealed arena did not preserve its mapped bytes")
              require(os.readlink("/proc/self/fd/" + str(arena)).startswith("/memfd:"),
                      "jailed arena is not a memfd")
          finally:
              os.close(arena)
          require(len(os.listdir("/proc/self/fd")) == before, "capability probe leaked descriptors")
          print("PASS: negative controls; tmpfs /dev/shm; disk /var/tmp; writable candidates; inotify; /proc/self/fd; sealed memfd")
          PY
          printf 'passed\n' > "$shared/$SLOT.passed"
          complete=0
          for ((poll=0; poll<240; poll++)); do
            if [[ -s "$shared/$peer.passed" ]]; then complete=1; break; fi
            sleep 5
          done
          [[ "$complete" = 1 ]] || fail 'Peer capability check did not finish in twenty minutes'
          printf 'PASS: both distinct local runners completed their capability checks\n'

