name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only. Main/post-merge uses a unique run_id group so
# in-progress and queued proof runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M

# The heavy jobs run on the organization's 16-core larger runner, and the macOS
# legs on GitHub's M2 runner for the macos-26 image, for a push, the schedule, a
# dispatch and a pull request from a branch of this repository. A larger runner
# bills the organization even for a public repository, so every other event --
# a fork's pull request above all -- runs on the free standard runner.
# Each verification sizes its parallelism to the runner that took it.
# scripts/ci_preflight.py pins every runner, time limit and job count, and
# docs/ci.md gives each limit's measured basis.
jobs:
  preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'pf-linux-x64-16' || 'ubuntu-24.04' }}
    # Its verifier-tests stage is one serial process: 475 s at 0d76a099's tree
    # on the maintainers' verification hosts, which ran it 1.93-1.95 times as
    # fast as the standard runner on the same trees, so about 15 min here. Ten
    # minutes cancelled main's run at 0d76a099 593 s into it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow linters
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          tools_dir="$RUNNER_TEMP/pineforge-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify workflow wiring and source guards
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight

      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-preflight
          path: build-ci-preflight/
          if-no-files-found: warn

  build:
    # Each leg keeps its name, build (<image>, <type>), whatever the matrix carries.
    name: build (${{ matrix.os }}, ${{ matrix.build_type }})
    # A full-set leg waits on the test_ci_verify CTest row, 976-1288 s on the
    # standard runners at 0d76a099, which more cores do not shorten. There the
    # Release legs, which a fork's pull request runs in full, took 30.3 and
    # 32.0 min, and the macOS Debug leg 37.0 min.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-24.04
            larger_runner: pf-linux-x64-16
          - os: macos-26
            larger_runner: macos-26-xlarge

    # matrix.os is the standard runner a fork's pull request gets; its
    # larger_runner runs the same image with more cores.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && matrix.larger_runner || matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tzdata-legacy carries the backward links test_native_calendar resolves
      # (US/Eastern, Japan, GB); noble split them out of tzdata, and the hosted
      # image happens to have it, so the row stays green on a bare runner too.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install eigen ccache
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-

      # The release profile fails below its CTest row floor (RELEASE_MIN_TESTS in
      # scripts/ci_verify.py); debug registers a subset of those rows.
      - name: Verify (${{ matrix.build_type }})
        env:
          # A40 rev 7: the relative runtime witness gates on process CPU time,
          # so every Release lane runs it, hosted macOS included (A40 rev 6 had
          # exempted that VM while the gated sample was wall clock). '1' is the
          # escape -- the row registers --candidate-only, one sample and no
          # ratio -- for a runner whose CPU accounting is unusable; record the
          # measured reason here and in docs/ci.md before setting it.
          PINEFORGE_RUNTIME_BUDGET_CANDIDATE_ONLY: '0'
        run: python3 scripts/ci_verify.py ${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --build-dir build --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache ${{ github.event_name == 'pull_request' && matrix.build_type == 'Debug' && '--exclude-label slow' || '' }}

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.os }}-${{ matrix.build_type }}
          path: ci-diagnostics/
          if-no-files-found: warn

  # Dedicated AddressSanitizer + UndefinedBehaviorSanitizer lane. Without this,
  # the determinism / NaN-propagation / handle-reuse / C-ABI-lifecycle probes
  # would run un-instrumented and could not actually trip the leak / double-free
  # / UB they target. The library is built with the sanitizers PUBLIC so the
  # instrumentation propagates into every test binary (CMakeLists.txt option
  # PINEFORGE_ENABLE_SANITIZERS).
  sanitizers:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'pf-linux-x64-16' || 'ubuntu-24.04' }}
    # A full run (push to main, manual dispatch) gives its CTest stage an hour
    # after the build; the PR set keeps its 30-minute stage, after about 30
    # minutes of build and ABI providers on the standard runner a fork's pull
    # request gets.
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-

      - name: Verify (sanitizers)
        run: python3 scripts/ci_verify.py sanitizers --build-dir build-asan --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache ${{ github.event_name == 'pull_request' && '--exclude-label slow' || '' }}

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-asan --profile sanitizers

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-sanitizers
          path: ci-diagnostics/
          if-no-files-found: warn

  # Kernel-only lane: PINEFORGE_BUILD_SOURCE_LAYER=OFF. Proves the engine
  # still configures, builds, installs and passes its source-free CTest set
  # with no Pine adapter compiled, and that libpineforge_kernel.a carries no
  # source-layer symbol. The live runner stays ON so its two native example
  # modules are built from the kernel alone, and every examples/native host
  # runs as an example_* row asserting both its exit code and its summary line.
  kernel-only:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'pf-linux-x64-16' || 'ubuntu-24.04' }}
    # 22.3 min on the standard runner at 0d76a099, where a fork's pull request
    # still runs the whole kernel set.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy libsqlite3-dev libssl-dev libcurl4-openssl-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-kernel-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-kernel-

      - name: Verify (kernel)
        run: python3 scripts/ci_verify.py kernel --build-dir build-kernel --jobs "$(getconf _NPROCESSORS_ONLN)" --ccache

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-kernel --profile kernel

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-kernel
          path: ci-diagnostics/
          if-no-files-found: warn

  # Reuse native proof once per CI run. Its manual dispatch runs every row.
  native-live:
    uses: ./.github/workflows/native-live.yml
    with:
      exclude_slow: ${{ github.event_name == 'pull_request' }}

  # Advisory TradingView parity subset on every CI run. The maintainers post
  # the required pineforge/parity status from their separate parity verdict.
  # Keep this job unfiltered so build-gate reports its result on every run.
  corpus-parity-subset:
    uses: ./.github/workflows/corpus-parity.yml
    with:
      mode: subset

  # Advisory aggregate context covering every GitHub Actions lane. The merge
  # ruleset requires pineforge/verify and pineforge/parity, posted by the
  # maintainers, rather than this build context.
  build-gate:
    name: build
    needs: [preflight, build, sanitizers, native-live, kernel-only, corpus-parity-subset]
    if: always()
    # A few seconds of shell: the standard runner, for every event.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification lane to have passed
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
          NATIVE_RESULT: ${{ needs.native-live.result }}
          KERNEL_RESULT: ${{ needs.kernel-only.result }}
          PARITY_RESULT: ${{ needs.corpus-parity-subset.result }}
        run: |
          printf '%s\n' "preflight: $PREFLIGHT_RESULT" "matrix: $BUILD_RESULT" \
            "sanitizers: $SANITIZER_RESULT" "native: $NATIVE_RESULT" \
            "kernel: $KERNEL_RESULT" "corpus parity (subset): $PARITY_RESULT"
          [[ "$PREFLIGHT_RESULT" == "success" && "$BUILD_RESULT" == "success" \
            && "$SANITIZER_RESULT" == "success" && "$NATIVE_RESULT" == "success" \
            && "$KERNEL_RESULT" == "success" && "$PARITY_RESULT" == "success" ]]
