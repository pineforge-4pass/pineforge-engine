name: CI

on:
  pull_request:
    # LB-387: suite jobs skip on a draft PR (the required aggregate then fails, never passes);
    # ready_for_review starts the full run when the PR is marked ready.
    # converted_to_draft re-runs the workflow so its failing aggregate supersedes the earlier ready run.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

# Post-merge events live in ci-post.yml; this file only schedules PR jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M
  # The run-failure source guards read the newest release tag. Every job that
  # runs them fetches it (fetch-depth: 0), so here a missing tag fails them
  # instead of taking their tag-less offline path (rebuilding the published
  # catalog from the checked-in diff), which only a clone without tags needs.
  PINEFORGE_REQUIRE_RELEASE_TAGS: "1"

# The canon authz gate admits our pull requests before any checkout.
# Each verification sizes its parallelism to the runner that took it.
# scripts/ci_preflight.py pins every runner, time limit and job count; every
# job's limit is the platform's own 360-minute maximum, the only hang catcher
# (owner rule, 2026-10-12), and docs/ci.md records why no bound of our own
# remains.
jobs:
  authz:
    name: authz
    # Fleet routing is fixed for this workflow; releases use pf-gcp-main.
    runs-on: ["self-hosted", "pf-gcp-pr"]
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # LB-437: bind identity to the triggering run and its re-runner.
              # These two App bots are fixed canon policy; ALLOWED_BOTS is PR-only.
              [ -n "${WR_HEAD_REPO:-}" ] || fail "workflow_run head repository is missing"
              [ -n "${WR_ACTOR:-}" ] || fail "workflow_run triggering actor is missing"
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run head repository does not match this repository"
              case "$WR_ACTOR" in
                "pineforge-app[bot]"|"pineforge-ci-dispatcher[bot]") ;;
                *"[bot]") fail "workflow_run bot is not on the canon allowlist" ;;
                *)
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null) || fail "workflow_run permission lookup failed"
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor does not have write permission" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  # Whether the change is documentation only; scripts/ci_docs_only.py holds the
  # rule, and every doubt answers no. On a docs-only pull request or push the
  # proof jobs below skip and the build aggregate accepts exactly that skip.
  # Preflight consumes its independent verifier-class answer, and docs.yml
  # builds the site as before. Classification uses the light pool class.
  changes:
    needs: [authz]
    runs-on: ["self-hosted","pf-gcp-pr"]
    permissions:
      contents: read
      pull-requests: read
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    outputs:
      github_only: ${{ steps.github-only.outputs.github_only }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      verifier_slow: ${{ steps.verifier.outputs.verifier_slow }}
    steps:
      # Scheduling hint only: build-gate repeats this API read for itself.
      - name: Read the PR diff independently
        id: github-only
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import Request, urlopen

          github_only = False
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              pr = event["pull_request"]
              number = event["number"]
              repo = os.environ["GITHUB_REPOSITORY"]
              head, base = pr["head"]["sha"], pr["base"]["sha"]
              if (type(number) is not int or number <= 0 or pr["number"] != number
                      or event["repository"]["full_name"] != repo
                      or not re.fullmatch(r"[0-9a-f]{40}", head)
                      or not re.fullmatch(r"[0-9a-f]{40}", base)):
                  raise ValueError("missing or invalid PR identity")
              endpoint = os.environ["GITHUB_API_URL"].rstrip("/") + f"/repos/{repo}/pulls/{number}"

              def api(url):
                  request = Request(url, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urlopen(request) as response:
                      return json.load(response)

              def snapshot():
                  current = api(endpoint)
                  if (current["number"] != number or current["head"]["sha"] != head
                          or current["base"]["sha"] != base):
                      raise ValueError("PR changed since this event; rerun CI")
                  count = current["changed_files"]
                  if type(count) is not int or not 0 < count <= 3000:
                      raise ValueError("empty or incomplete PR diff")
                  return count

              def path(value):
                  if (not isinstance(value, str) or not value
                          or any(ord(char) < 32 for char in value) or "\\" in value
                          or any(part in ("", ".", "..") for part in value.split("/"))):
                      raise ValueError("unreadable PR path")
                  return value

              count = snapshot()
              paths, filenames = [], set()
              for page in range(1, (count + 99) // 100 + 1):
                  rows = api(endpoint + f"/files?per_page=100&page={page}")
                  if not isinstance(rows, list) or len(rows) != min(100, count - len(filenames)):
                      raise ValueError("missing or truncated PR files page")
                  for row in rows:
                      filename = path(row["filename"])
                      if filename in filenames or row["status"] not in (
                              "added", "modified", "removed", "renamed", "copied", "changed", "unchanged"):
                          raise ValueError("duplicate or unreadable PR file")
                      filenames.add(filename)
                      paths.append(filename)
                      if row["status"] == "renamed" or "previous_filename" in row:
                          paths.append(path(row["previous_filename"]))
              if len(filenames) != count or snapshot() != count:
                  raise ValueError("PR diff changed while reading files")
              github_only = bool(paths) and all(value.startswith(".github/") for value in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("github_only=" + str(github_only).lower() + "\n")

      # The tested commit and its parents: a pull request's merge and the base
      # it merged into, a push's commit and its parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      # The base's own copy of the rule judges the change, so a change to the
      # rule is never judged by itself; a base without one runs every job.
      - name: Classify the change
        id: classify
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          if git show HEAD^1:scripts/ci_docs_only.py > "$RUNNER_TEMP/ci_docs_only.py"; then
            python3 "$RUNNER_TEMP/ci_docs_only.py" --root . --github-output "$GITHUB_OUTPUT"
          else
            echo "not docs-only: the base holds no scripts/ci_docs_only.py"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # This helper uses the base ci_docs_only.py staged above to read the
      # same tested diff. A base without the new rule runs every class.
      - name: Classify verifier self-tests
        id: verifier
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git show HEAD^1:scripts/ci_verifier_paths.py > "$RUNNER_TEMP/ci_verifier_paths.py"; then
            python3 "$RUNNER_TEMP/ci_verifier_paths.py" --root . --github-output "$GITHUB_OUTPUT"
          else
            echo "verifier SLOW: the base holds no scripts/ci_verifier_paths.py"
            echo "verifier_slow=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    needs: [authz, changes]
    if: ${{ !github.event.pull_request.draft && (always() && needs.authz.result == 'success') }}
    runs-on: ["self-hosted","pf-gcp-pr"]
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64-16"]'
      PINEFORGE_VERIFIER_SLOW: ${{ needs.changes.result == 'success' && needs.changes.outputs.verifier_slow || 'true' }}
    # PRs run only source, documentation and policy checks. Build-driving
    # controls and dependency-heavy harness tests live in preflight-slow.
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@v4
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install workflow linters
        if: ${{ needs.authz.result == 'success' }}
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          tools_dir="$RUNNER_TEMP/pineforge-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify workflow wiring and source guards
        if: ${{ needs.authz.result == 'success' }}
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight --tier ${{ github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.github_only == 'true' && 'github-only' || 'fast' }}

      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-preflight
          path: build-ci-preflight/
          if-no-files-found: warn

  build:
    # Each leg keeps its name, build (<image>, <type>), whatever the matrix
    # carries. A skipped matrix is never expanded: a docs-only run shows one
    # skipped build check under the unexpanded name.
    name: build (${{ matrix.platform.os }}, ${{ matrix.build_type }})
    # Proof jobs follow authz and classification alongside preflight. Only a
    # successful docs-only or GitHub-only answer skips scheduling; the aggregate
    # independently reads the PR diff before accepting the latter skip.
    needs: [authz, changes]
    if: ${{ !github.event.pull_request.draft && (always() && needs.authz.result == 'success' && (needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.github_only != 'true')))) }}
    # 360 minutes (the platform maximum): a full-set leg waits on the
    # test_ci_verify CTest row, 976-1288 s on the standard runners at
    # 0d76a099, which more cores do not shorten. No bound of ours may fail a
    # slow leg (owner rule, 2026-10-12).
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
        build_type: [Release]

    runs-on: ["self-hosted","pf-gcp-pr"]
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64-16"]'

    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - uses: actions/checkout@v4
        if: ${{ needs.authz.result == 'success' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tzdata-legacy carries the backward links test_native_calendar resolves
      # (US/Eastern, Japan, GB); noble split them out of tzdata, and the hosted
      # image happens to have it, so the row stays green on a bare runner too.
      - name: Install dependencies (Linux)
        if: ${{ needs.authz.result == 'success' && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev tzdata-legacy ccache

      # PRs restore the newest compatible main cache via the default-branch
      # fallback. Only main writes this namespace, never a PR merge ref.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-main-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-main-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-

      # The release profile fails below its CTest row floor (its row of the
      # PRIVATE_FIXTURE_PROFILE_FLOORS table in scripts/ci_verify.py);
      # debug registers a subset of those rows.
      - name: Verify (${{ matrix.build_type }})
        env:
          # A40 rev 7: the relative runtime witness gates on process CPU time,
          # so every Release lane runs it, hosted macOS included (A40 rev 6 had
          # exempted that VM while the gated sample was wall clock). '1' is the
          # escape -- the row registers --candidate-only, one sample and no
          # ratio -- for a runner whose CPU accounting is unusable; record the
          # measured reason here and in docs/ci.md before setting it.
          PINEFORGE_RUNTIME_BUDGET_CANDIDATE_ONLY: '0'
        if: ${{ needs.authz.result == 'success' }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPINEFORGE_VERSION_SOURCE=FILE \
            -DPython3_EXECUTABLE="$(command -v python3)" -DPINEFORGE_BUILD_TESTS=ON \
            -DPINEFORGE_BUILD_SOURCE_LAYER=ON -DPINEFORGE_BUILD_TUTORIAL=OFF \
            -DPINEFORGE_BUILD_LIVE_RUNNER=OFF -DPINEFORGE_BUILD_CORPUS_STRATEGIES=OFF \
            -DPINEFORGE_BUILD_EXAMPLES=OFF -DPINEFORGE_REQUIRE_ABI_RECEIPTS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target pineforge_pr_smoke --parallel "$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build -L '^fast$' --output-on-failure --no-tests=error \
            --parallel "$(getconf _NPROCESSORS_ONLN)" --timeout 0 --output-junit build/ctest-junit.xml

      - name: Stage and summarize diagnostics
        if: ${{ always() && needs.authz.result == 'success' }}
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.platform.os }}-${{ matrix.build_type }}
          path: ci-diagnostics/
          if-no-files-found: warn

      - name: Save main ccache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  # Advisory TradingView parity subset, except docs-only and GitHub-only PRs.
  # The maintainers post the required pineforge/parity status from their
  # separate parity verdict. build-gate independently verifies GitHub-only skips.
  corpus-parity-subset:
    needs: [authz, changes]
    if: ${{ !github.event.pull_request.draft && (always() && needs.authz.result == 'success' && (needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.github_only != 'true')))) }}
    uses: ./.github/workflows/corpus-parity-subset.yml

  # Advisory aggregate context covering every GitHub Actions lane. The merge
  # ruleset requires pineforge/verify and pineforge/parity, posted by the
  # maintainers, rather than this build context.
  build-gate:
    name: build
    needs: [authz, changes, preflight, build, corpus-parity-subset]
    if: always()
    # The aggregate runs inline Python and shell on the light pool class.
    runs-on: ["self-hosted","pf-gcp-pr"]
    permissions:
      contents: read
      pull-requests: read
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      # No checkout and no changes-job classification is used for this verdict.
      - name: Read the PR diff independently
        id: github-only
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import Request, urlopen

          github_only = False
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              pr = event["pull_request"]
              number = event["number"]
              repo = os.environ["GITHUB_REPOSITORY"]
              head, base = pr["head"]["sha"], pr["base"]["sha"]
              if (type(number) is not int or number <= 0 or pr["number"] != number
                      or event["repository"]["full_name"] != repo
                      or not re.fullmatch(r"[0-9a-f]{40}", head)
                      or not re.fullmatch(r"[0-9a-f]{40}", base)):
                  raise ValueError("missing or invalid PR identity")
              endpoint = os.environ["GITHUB_API_URL"].rstrip("/") + f"/repos/{repo}/pulls/{number}"

              def api(url):
                  request = Request(url, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urlopen(request) as response:
                      return json.load(response)

              def snapshot():
                  current = api(endpoint)
                  if (current["number"] != number or current["head"]["sha"] != head
                          or current["base"]["sha"] != base):
                      raise ValueError("PR changed since this event; rerun CI")
                  count = current["changed_files"]
                  if type(count) is not int or not 0 < count <= 3000:
                      raise ValueError("empty or incomplete PR diff")
                  return count

              def path(value):
                  if (not isinstance(value, str) or not value
                          or any(ord(char) < 32 for char in value) or "\\" in value
                          or any(part in ("", ".", "..") for part in value.split("/"))):
                      raise ValueError("unreadable PR path")
                  return value

              count = snapshot()
              paths, filenames = [], set()
              for page in range(1, (count + 99) // 100 + 1):
                  rows = api(endpoint + f"/files?per_page=100&page={page}")
                  if not isinstance(rows, list) or len(rows) != min(100, count - len(filenames)):
                      raise ValueError("missing or truncated PR files page")
                  for row in rows:
                      filename = path(row["filename"])
                      if filename in filenames or row["status"] not in (
                              "added", "modified", "removed", "renamed", "copied", "changed", "unchanged"):
                          raise ValueError("duplicate or unreadable PR file")
                      filenames.add(filename)
                      paths.append(filename)
                      if row["status"] == "renamed" or "previous_filename" in row:
                          paths.append(path(row["previous_filename"]))
              if len(filenames) != count or snapshot() != count:
                  raise ValueError("PR diff changed while reading files")
              github_only = bool(paths) and all(value.startswith(".github/") for value in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("github_only=" + str(github_only).lower() + "\n")

      - name: Require every verification lane to have passed
        shell: bash
        env:
          AUTHZ_RESULT: ${{ needs.authz.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          GITHUB_ONLY: ${{ steps.github-only.outputs.github_only }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PARITY_RESULT: ${{ needs.corpus-parity-subset.result }}
        run: |
          printf '%s\n' "authz: $AUTHZ_RESULT" "changes: $CHANGES_RESULT, docs only: ${DOCS_ONLY:-unanswered}" \
            "preflight: $PREFLIGHT_RESULT" "matrix: $BUILD_RESULT" \
            "corpus parity (subset): $PARITY_RESULT"
          # Every selected PR proof must pass.
          # GitHub-only skips use this job's own API read, never changes' output.
          # Classified docs-only skips retain their policy; preflight must pass.
          docs_only=false
          if [[ "$CHANGES_RESULT" == "success" && "$DOCS_ONLY" == "true" ]]; then docs_only=true; fi
          github_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "${GITHUB_ONLY:-false}" == "true" ]]; then github_only=true; fi
          passed() { [[ "$1" == "success" || ( ( "$docs_only" == "true" || "$github_only" == "true" ) && "$1" == "skipped" ) ]]; }
          [[ "$AUTHZ_RESULT" == "success" && "$CHANGES_RESULT" == "success" ]] \
            && [[ "$PREFLIGHT_RESULT" == "success" ]] && passed "$BUILD_RESULT" \
            && passed "$PARITY_RESULT"
