name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs only. Main/post-merge uses a unique run_id group so
# in-progress and queued proof runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow linters
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          tools_dir="$RUNNER_TEMP/pineforge-actionlint"
          mkdir -p "$tools_dir"
          archive="$tools_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$tools_dir" actionlint
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Verify workflow wiring and source guards
        run: python3 scripts/ci_preflight.py --output-dir build-ci-preflight

      - name: Retain preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-preflight
          path: build-ci-preflight/
          if-no-files-found: warn

  build:
    needs: preflight
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        build_type: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install eigen ccache
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-

      - name: Verify (${{ matrix.build_type }})
        env:
          # A40 rev 6: the hosted macOS VM is not a stable timing host; the
          # relative runtime witness gates on Linux CI and local builds.
          PINEFORGE_RUNTIME_BUDGET_CANDIDATE_ONLY: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python3 scripts/ci_verify.py ${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --build-dir build --jobs 4 --ccache

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.os }}-${{ matrix.build_type }}
          path: ci-diagnostics/
          if-no-files-found: warn

  # Dedicated AddressSanitizer + UndefinedBehaviorSanitizer lane. Without this,
  # the determinism / NaN-propagation / handle-reuse / C-ABI-lifecycle probes
  # would run un-instrumented and could not actually trip the leak / double-free
  # / UB they target. The library is built with the sanitizers PUBLIC so the
  # instrumentation propagates into every test binary (CMakeLists.txt option
  # PINEFORGE_ENABLE_SANITIZERS).
  sanitizers:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-

      - name: Verify (sanitizers)
        run: python3 scripts/ci_verify.py sanitizers --build-dir build-asan --jobs 4 --ccache

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-asan --profile sanitizers

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-sanitizers
          path: ci-diagnostics/
          if-no-files-found: warn

  # Kernel-only lane: PINEFORGE_BUILD_SOURCE_LAYER=OFF. Proves the engine
  # still configures, builds, installs and passes its source-free CTest set
  # with no Pine adapter compiled, and that libpineforge_kernel.a carries no
  # source-layer symbol. The live runner stays ON so both native examples
  # are built from the kernel alone.
  kernel-only:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev libsqlite3-dev libssl-dev libcurl4-openssl-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-kernel-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-kernel-

      - name: Verify (kernel)
        run: python3 scripts/ci_verify.py kernel --build-dir build-kernel --jobs 4 --ccache

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-kernel --profile kernel

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-kernel
          path: ci-diagnostics/
          if-no-files-found: warn

  # Reuse the full native proof once per CI run. The reusable workflow also
  # retains manual dispatch for explicitly requested standalone verification.
  native-live:
    needs: preflight
    uses: ./.github/workflows/native-live.yml

  # Keep the required `build` context while making it cover every proof lane.
  # Failure, cancellation or skipping in any dependency must fail this gate.
  build-gate:
    name: build
    needs: [preflight, build, sanitizers, native-live, kernel-only]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification lane to have passed
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
          NATIVE_RESULT: ${{ needs.native-live.result }}
          KERNEL_RESULT: ${{ needs.kernel-only.result }}
        run: |
          printf '%s\n' "preflight: $PREFLIGHT_RESULT" "matrix: $BUILD_RESULT" \
            "sanitizers: $SANITIZER_RESULT" "native: $NATIVE_RESULT" \
            "kernel: $KERNEL_RESULT"
          [[ "$PREFLIGHT_RESULT" == "success" && "$BUILD_RESULT" == "success" \
            && "$SANITIZER_RESULT" == "success" && "$NATIVE_RESULT" == "success" \
            && "$KERNEL_RESULT" == "success" ]]
