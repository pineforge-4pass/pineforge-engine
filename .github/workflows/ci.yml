name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs only. Main/post-merge uses a unique run_id group so
# in-progress and queued proof runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install eigen ccache
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-

      - name: Verify (${{ matrix.build_type }})
        run: python3 scripts/ci_verify.py ${{ matrix.build_type == 'Release' && 'release' || 'debug' }} --build-dir build --jobs 4 --ccache

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build --profile ${{ matrix.build_type == 'Release' && 'release' || 'debug' }}

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.os }}-${{ matrix.build_type }}
          path: ci-diagnostics/
          if-no-files-found: warn

  # Dedicated AddressSanitizer + UndefinedBehaviorSanitizer lane. Without this,
  # the determinism / NaN-propagation / handle-reuse / C-ABI-lifecycle probes
  # would run un-instrumented and could not actually trip the leak / double-free
  # / UB they target. The library is built with the sanitizers PUBLIC so the
  # instrumentation propagates into every test binary (CMakeLists.txt option
  # PINEFORGE_ENABLE_SANITIZERS).
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libeigen3-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-

      - name: Verify (sanitizers)
        run: python3 scripts/ci_verify.py sanitizers --build-dir build-asan --jobs 4 --ccache

      - name: Stage and summarize diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py --build-dir build-asan --profile sanitizers

      - name: Retain CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-sanitizers
          path: ci-diagnostics/
          if-no-files-found: warn

  # The branch ruleset requires a status check named `build`, but the matrix
  # job above reports as `build (ubuntu-latest, Release)` and friends -- a bare
  # `build` context never appears, so the merge stays BLOCKED even with every
  # check green. This gate carries that exact name and passes only when every
  # matrix build did, satisfying the ruleset without loosening it.
  build-gate:
    name: build
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix build to have passed
        run: |
          echo "matrix build result: ${{ needs.build.result }}"
          test "${{ needs.build.result }}" = "success"
