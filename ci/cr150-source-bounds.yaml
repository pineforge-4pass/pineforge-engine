# CR-150 / C4 source allocation-bound manifest (scripts/cr150_source_gate.py).
#
# Format: the restricted YAML subset the gate parses (maps, lists, flow maps).
# Every container-bearing site in the scanned set (scan.files + generated_files)
# needs an entry grouped by (file, symbol). Each concrete occurrence is also
# recorded in the companion JSON site inventory: lexical brace scope (tokenized
# header + sibling ordinal), operation/type spelling and occurrence ordinal.
# Lines remain diagnostics, never identity. New/missing identities fail closed,
# even when their symbol and op classes already have an OPEN entry.
# `site_inventory` is an optional root-relative path, defaulting to
# ci/cr150-source-sites.json. Its file is required, read-only during verification
# and reviewed separately; --emit-site-inventory only AUTHORS a proposed snapshot.
# The existing entry rows need no scope fields or edits to retain their IDs.
# The gate also fails on an unlisted/stale entry, an op class the entry does not
# list, unsupported bounded growth, codegen pin drift or an OPEN ceiling excess.
#
# States
#   bounded              bound = expression over declared fixed_inputs only (no bars,
#                        trades, entries, decisions, history, no container size);
#                        counted PASS(bounded) only for the supported enforced
#                        form: initially empty local scalar vector, every push
#                        directly guarded by its own size() < the fixed bound,
#                        one numeric-literal push per branch, no aliases/other
#                        uses. reserve/assign/resize alone never enforce a cap.
#                        Unsupported forms stay OPEN. Needs lifetime, rollback,
#                        hash_reader and tests. Fixed inputs need an uncommented
#                        namespace/class-scope const/constexpr integer definition
#                        matching their required positive `value`; class inputs
#                        must be static (an instance may override a const field).
#   pending-flat-memory  the A-section inventory row (o1inv REPORT, `inventory`)
#                        names the growth axis (`grows_with`); the flat-memory
#                        implementation has not landed. OPEN, never PASS.
#   unreviewed           the scanner found the container; nobody has established
#                        a bound. OPEN, never PASS. phase is `unclassified`.
# `ceilings` cap the OPEN entries per state: a new OPEN entry needs a reviewed
# ceiling increase, so regenerating a baseline cannot silently widen the list.
# `owner` is the code area that must supply the bound (see `owners`); it is not a
# person or lane roster.
#
# Provenance of the seed: every scanned key was emitted by
# `scripts/cr150_source_gate.py --emit-seed` as `unreviewed`; keys whose member
# name is cited by an A-section row of core-cr150-o1inv/REPORT.md (A1-A8) were then
# re-labelled pending-flat-memory (or kept unreviewed when that row's work code is
# V, "verify existing bound") with the row id and its stated growth axis. Two more
# rules added rows: a hand table of members the A text names without a backticked
# identifier, and an element-type rule (exactly one A row whose sizeof(Type) is the
# declaration's element type, in a file that row cites). No entry
# was marked bounded: no scanned container has a named fixed pre-bar-0 constant
# in source that bounds it.
schema: cr150-source-bounds/v1
site_inventory: ci/cr150-source-sites.json
codegen:
  pin: "89b48cb6e2fed0c0f824f24658fdb5ad96caef59"
  pin_source: scripts/regen_corpus_cpp.sh
  tree: absent
  # The codegen checkout is not in this tree, so its emitter source is NOT
  # scanned. These are the container shapes the pinned emitter is documented
  # (docs/coverage.md:58, :895-896) and observed (tutorial/**/generated*.cpp) to
  # emit. All OPEN: a bound for generated user state needs a codegen-side proof.
  emitter_templates:
    - {id: "T01", emits: "Pine array<T> as std::vector<T>", owner: "generated-cpp", phase: "bar", state: "pending-flat-memory", grows_with: ["bars", "events"], inventory: "U01"}
    - {id: "T02", emits: "UDT as generated struct with nested std::vector/std::string members", owner: "generated-cpp", phase: "bar", state: "pending-flat-memory", grows_with: ["payload-bytes"], inventory: "U07"}
    - {id: "T03", emits: "Series<T> per series variable (fixed ring, lazy first-push resize)", owner: "generated-cpp", phase: "setup", state: "unreviewed"}
    - {id: "T04", emits: "PineMap<K,V> handles (entry count capped by the runtime, payload not)", owner: "generated-cpp", phase: "bar", state: "pending-flat-memory", grows_with: ["distinct-keys", "payload-bytes"], inventory: "U03"}
    - {id: "T05", emits: "std::string temporaries for str.* and formatted order comments", owner: "generated-cpp", phase: "bar", state: "pending-flat-memory", grows_with: ["payload-bytes"], inventory: "U02"}
    - {id: "T06", emits: "ta::* indicator objects with window buffers per call site", owner: "generated-cpp", phase: "bar", state: "pending-flat-memory", grows_with: ["window-length"], inventory: "U15"}
scan:
  files:
    - "src/**/*.cpp"
    - "src/**/*.hpp"
    - "src/**/*.inc"
    - "include/pineforge/**/*.hpp"
    - "include/pineforge/**/*.h"
  generated_files:
    - "tutorial/**/generated*.cpp"
ceilings:
  unreviewed: 1324
  pending-flat-memory: 184
owners:
  - {name: "generated-cpp", globs: ["tutorial/**"]}
  - {name: "c-abi", globs: ["src/c_abi.cpp", "src/native_c_host.cpp", "src/selected_window_plan_c.cpp", "include/pineforge/*.h"]}
  - {name: "source-layer", globs: ["src/source/**", "include/pineforge/source/**", "src/compat/**", "include/pineforge/compat/**"]}
  - {name: "calendar-time", globs: ["src/native_calendar*", "include/pineforge/native_calendar.hpp", "src/timeframe.cpp", "src/timezone.*", "src/session_time.cpp", "include/pineforge/timeframe.hpp", "include/pineforge/session_time.hpp"]}
  - {name: "native-kernel", globs: ["src/native_*", "include/pineforge/native_*", "src/execution*", "include/pineforge/execution*", "include/pineforge/exit_leg_lifecycle.hpp", "include/pineforge/leg_activation.hpp", "include/pineforge/order_*.hpp", "include/pineforge/position_close_obligation.hpp", "include/pineforge/quantity_intent.hpp", "include/pineforge/query_refusal.hpp", "include/pineforge/reservation_expansion.hpp", "include/pineforge/broker_events.hpp", "include/pineforge/magnifier.hpp", "include/pineforge/market_driver.hpp", "include/pineforge/pending_order_mirror.hpp", "src/magnifier.cpp", "src/market_driver.cpp", "src/pending_order_mirror.cpp", "src/reservation_expansion.cpp", "src/broker_state_hash_internal.hpp"]}
  - {name: "ta-series", globs: ["src/ta_*", "include/pineforge/ta*.hpp", "include/pineforge/series.hpp", "include/pineforge/window_sum.hpp", "include/pineforge/math.hpp", "src/math.cpp"]}
  - {name: "script-state", globs: ["src/matrix.cpp", "include/pineforge/matrix.hpp", "include/pineforge/generic_matrix.hpp", "include/pineforge/map.hpp", "include/pineforge/drawing.hpp", "src/str_utils.cpp", "include/pineforge/str_utils.hpp", "include/pineforge/color.hpp", "include/pineforge/na.hpp"]}
  - {name: "engine-core", globs: ["src/**", "include/**"]}
# No bound input is declared: nothing scanned has a named fixed constant that
# bounds it. A bounded entry must first declare one here, with its definition.
fixed_inputs:
  []
